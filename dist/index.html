<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2622">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="잡도리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="잡도리앱 프로토타입 — 전담 마스코트 미루먼지가 미루는 일을 잡도리하는 자기관리 앱">
<title>잡도리 — 미루먼지 (프로토타입)</title>
<style>
/* =========================================================
   잡도리앱 "물 올린다" — 스타일 (DESIGN.md 기준)
   ========================================================= */
@font-face {
  font-family: "Pretendard";
  src: url("fonts/PretendardVariable-ko2350.woff2") format("woff2-variations"), url("fonts/PretendardVariable-ko2350.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}
:root {
  --canvas: #F3EEE5; --surface: #FBF8F2; --field: #FFFDF8; --sunken: #EAE3D6;
  --line: #DDD3C3; --line-strong: #C9BEAC;
  --ink: #26211C; --ink-2: #6A6157; --ink-hover: #3A332D;
  --stove: #2B2622; --stove-2: #3A332D; --stove-line: #4A423A;
  --on-stove: #F3ECE0; --on-stove-2: #B9AC9A;
  --heat-1: #B8A587; --heat-2: #D99A2B; --heat-3: #DF7A2C; --heat-4: #D4532A; --heat-5: #B42F1F;
  --heat-ink: #9A3A1E;
  --success: #3C7452; --success-soft: #DCE7DA;
  --danger: #B42F1F; --danger-soft: #F3DDD5;
  --kakao: #FEE500; --kakao-ink: #191919;
  --font: Pretendard, "Pretendard Variable", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --r-s: 10px; --r-m: 14px; --r-l: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.6; font-weight: 500; color: var(--ink);
  background: var(--canvas); word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.on-stove :focus-visible, .on-dark:focus-visible, .stove-band :focus-visible, .result :focus-visible { outline-color: var(--on-stove); }
.result :focus-visible { outline-color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.muted { color: var(--ink-2); }
.num, .deg, time, .wk-n, .mo-n { font-variant-numeric: tabular-nums; }

/* ---------- 기기 틀 / 배치 ---------- */
.stage { min-height: 100dvh; }
.device { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: var(--canvas); }
.statusbar { display: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; }
#screen { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative; }
#screen.enter > .scr { animation: enter .26s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
#tabbar { flex: none; }
#app.no-tabs #tabbar { display: none; }
#layer-sheet, #layer-popup, #layer-result { position: absolute; inset: 0; pointer-events: none; }
#layer-sheet > *, #layer-popup > *, #layer-result > * { pointer-events: auto; }
#layer-sheet { z-index: 50; } #layer-result { z-index: 52; } #layer-popup { z-index: 55; }
#layer-sheet:empty, #layer-popup:empty, #layer-result:empty { display: none; }

@media (min-width: 900px) and (min-height: 700px) {
  body { background: #E4DCCE; }
  .stage { display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px; }
  .device { width: 390px; height: min(844px, calc(100dvh - 48px)); border-radius: 54px; border: 11px solid var(--stove); box-shadow: 0 2px 8px rgba(43, 38, 34, .10), 0 30px 60px -24px rgba(43, 38, 34, .35); flex: none; }
  .statusbar { display: flex; position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 60; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; pointer-events: none; color: var(--sb-color, var(--ink)); }
  .statusbar .sb-r { display: flex; gap: 6px; align-items: center; }
  .statusbar .sb-r i { display: block; width: 22px; height: 11px; border: 1.6px solid currentColor; border-radius: 3.5px; position: relative; opacity: .9; }
  .statusbar .sb-r i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
  .statusbar .sb-r small { font-size: 11px; font-weight: 600; opacity: .8; }
  .device { --safe-top: 44px; --safe-bottom: 14px; }
  .device { background: var(--stove); }
  #app { border-radius: 43px; clip-path: inset(0 round 43px); background: var(--canvas); }
  .device.dark-top { --sb-color: var(--on-stove); }
}

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r-m); font-weight: 650; font-size: 16px; line-height: 1.3; transition: transform .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease); text-align: center; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn.primary:disabled, .btn.primary[aria-disabled="true"] { background: var(--sunken); color: var(--ink-2); }
.btn.secondary { border: 1.5px solid var(--line-strong); background: transparent; }
.btn.ghost { color: var(--ink-2); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.danger-outline { border: 1.5px solid #E3B7AB; color: var(--danger); }
.btn.light { background: var(--on-stove); color: var(--ink); }
.btn.ghost-light { color: var(--on-stove); border: 1.5px solid rgba(243, 236, 224, .28); }
.btn.danger-light { background: #4A2620; color: #F7D9CF; border: 1.5px solid #7A3528; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; flex: none; }
.icon-btn.on-dark { color: var(--on-stove); }
.icon-btn:disabled { opacity: .35; }
.link-btn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0 2px; }
.link-btn .ic { width: 16px; height: 16px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 공통 텍스트 ---------- */
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: calc(var(--safe-top) + 14px) 20px 14px; }
.hdr-title { font-size: 22px; line-height: 1.3; font-weight: 720; }
.hdr-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.hdr.on-dark .hdr-sub { color: var(--on-stove-2); }
.paper { padding: 4px 20px 28px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 6px; }
.sec-head.mt, .sec-title.mt { margin-top: 26px; }
.sec-title { font-size: 17px; font-weight: 700; line-height: 1.4; }
.sec-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; letter-spacing: .02em; color: var(--ink-2); margin: 18px 0 2px; }
.sec-label .ic { width: 16px; height: 16px; }
.hint { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-top: 8px; }
.hint:empty { display: none; }
.hint.center { text-align: center; }
.fine { font-size: 12px; color: var(--on-stove-2); text-align: center; line-height: 1.6; }
.fine.dark { color: var(--ink-2); margin-top: 28px; text-align: left; }
.deg { display: inline-flex; align-items: flex-start; font-weight: 760; letter-spacing: -0.02em; line-height: 1; }
.deg-u { font-size: .5em; margin-left: .04em; margin-top: .08em; font-weight: 650; }
.deg.xl { font-size: 56px; }
.deg.xxl { font-size: 88px; }
.deg.lg { font-size: 44px; }
.deg.md { font-size: 30px; }
.stage-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--ink); white-space: nowrap; }
.stage-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--hc); }
.stage-chip.on-dark { background: var(--stove-2); color: var(--on-stove); }

/* ---------- 말풍선 ---------- */
.speech { position: relative; font-size: 17px; line-height: 1.5; font-weight: 650; padding: 14px 16px; border-radius: 16px; background: var(--surface); color: var(--ink); }
.speech.on-dark { background: var(--stove-2); color: var(--on-stove); }
.speech.on-dark::before { content: ""; position: absolute; top: -8px; left: 46px; width: 16px; height: 16px; background: inherit; transform: rotate(45deg); border-radius: 3px; }
.speech.big { font-size: 18px; margin: 0 20px; }
.speech.big::before { left: 50%; margin-left: -8px; }
.speech.say > span { display: inline-block; animation: say .24s var(--ease) both; }
@keyframes say { from { opacity: 0; transform: translate3d(0, 4px, 0); } to { opacity: 1; transform: none; } }
.paper-speech { background: var(--sunken); text-align: center; margin: 10px 0 0; }

/* ---------- 로그인 ---------- */
.on-stove { background: var(--stove); color: var(--on-stove); }
.scr.login { min-height: 100%; display: flex; flex-direction: column; padding: calc(var(--safe-top) + 40px) 24px calc(var(--safe-bottom) + 24px); }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--on-stove-2); letter-spacing: .02em; }
.wordmark { font-size: 46px; font-weight: 860; letter-spacing: -0.025em; line-height: 1.15; margin-top: 6px; }
.tagline { font-size: 19px; font-weight: 650; margin-top: 6px; line-height: 1.45; }
.login-bottom { display: flex; flex-direction: column; gap: 12px; }
.btn-kakao { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border-radius: 12px; background: var(--kakao); color: var(--kakao-ink); font-size: 16px; font-weight: 700; transition: transform .2s var(--ease), filter .2s var(--ease); }
.btn-kakao:active { transform: scale(.98); }
.btn-kakao[aria-busy="true"] { filter: saturate(.75); cursor: progress; }
.kakao-sym { width: 20px; height: 20px; flex: none; }
.login-steps { display: flex; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--on-stove-2); height: 0; overflow: hidden; opacity: 0; transition: opacity .2s var(--ease); }
.login-steps.show { height: auto; opacity: 1; }
.login-steps li { display: flex; align-items: center; gap: 6px; }
.login-steps li + li::before { content: ""; width: 14px; height: 1.5px; background: var(--stove-line); }
.login-steps li.now { color: var(--on-stove); font-weight: 700; }
.login-steps li.done { color: var(--on-stove); }
.notice { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-m); background: var(--stove-2); align-items: flex-start; }
.notice > .ic { margin-top: 2px; }
.notice.err > .ic { color: #F09A80; }
.notice b { font-size: 15px; display: block; }
.notice p { font-size: 13.5px; color: var(--on-stove-2); margin-top: 2px; line-height: 1.55; }
.notice-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.soft-note { font-size: 14px; color: var(--on-stove); background: var(--stove-2); padding: 12px 14px; border-radius: 12px; line-height: 1.55; }

/* ---------- 온보딩 ---------- */
.scr.onb { min-height: 100%; display: flex; flex-direction: column; padding: calc(var(--safe-top) + 10px) 24px calc(var(--safe-bottom) + 20px); }
.onb-bar { display: flex; align-items: center; justify-content: space-between; }
.onb-dots { display: flex; gap: 6px; }
.onb-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--stove-line); }
.onb-dots i.on { background: var(--on-stove); }
.onb-text { flex: 1; }
.onb-title { font-size: 26px; line-height: 1.35; font-weight: 760; letter-spacing: -0.01em; }
.onb-body { font-size: 16px; line-height: 1.7; color: var(--on-stove-2); margin-top: 12px; }
.onb-body b { color: var(--on-stove); font-weight: 700; }
.onb-sub { font-size: 14px; color: var(--on-stove-2); margin-top: 14px; }
.assign { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--stove-2); margin-bottom: 12px; }
.assign .ic { width: 16px; height: 16px; color: #9BC7A6; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.traits li { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--stove-line); color: var(--on-stove); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.scale-step { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 8px; border-radius: 10px; min-height: 64px; border: 1.5px solid transparent; }
.scale-step i { width: 100%; height: 6px; border-radius: 3px; background: var(--hc); opacity: .55; }
.scale-step b { font-size: 13.5px; font-weight: 700; }
.scale-step span { font-size: 11.5px; color: var(--on-stove-2); font-variant-numeric: tabular-nums; }
.scale-step.on { border-color: var(--on-stove); background: var(--stove-2); }
.scale-step.on i { opacity: 1; }
.scale-desc { font-size: 14px; margin-top: 12px; color: var(--on-stove-2); line-height: 1.65; }
.scale-desc b { color: var(--on-stove); }
.scale-desc q { display: inline-block; margin-top: 4px; color: var(--on-stove); font-weight: 600; quotes: "“" "”"; }
.stamps { display: flex; gap: 14px; margin: 16px 0 4px; }
.onb-foot { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 18px; }

/* ---------- 도장 ---------- */
.stamp { display: inline-grid; place-items: center; width: 116px; height: 116px; border-radius: 50%; border: 4px solid currentColor; font-size: 21px; font-weight: 820; letter-spacing: -0.01em; transform: rotate(-8deg); box-shadow: inset 0 0 0 4px var(--stamp-bg, transparent), inset 0 0 0 6px currentColor; animation: stamp .34s var(--ease-bounce) both; text-align: center; line-height: 1.15; }
.stamp.ok { color: var(--success); }
.stamp.bad { color: var(--danger); }
.stamp.sm { width: 84px; height: 84px; font-size: 15px; border-width: 3px; box-shadow: inset 0 0 0 3px var(--stamp-bg, transparent), inset 0 0 0 4.5px currentColor; animation: none; }
.on-stove .stamp.ok { color: #8FC29E; } .on-stove .stamp.bad { color: #EE8B70; }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.8) rotate(-16deg); } 60% { opacity: 1; transform: scale(.94) rotate(-8deg); } 100% { transform: scale(1) rotate(-8deg); } }

/* ---------- 오늘: 화구 띠 ---------- */
.stove-band { background: var(--stove); color: var(--on-stove); padding-bottom: 20px; }
.stove-band .hdr { padding-bottom: 6px; }
.persona-row { display: grid; grid-template-columns: minmax(128px, 42%) 1fr; align-items: center; gap: 10px; padding: 4px 20px 14px; }
.pt-label { font-size: 13px; color: var(--on-stove-2); font-weight: 600; }
.persona-temp .deg { margin: 2px 0 8px; }
.pt-stage { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--on-stove-2); line-height: 1.45; }
.stove-band .speech { margin: 0 20px 14px; }
.ticket { position: relative; display: flex; margin: 0 20px; background: var(--surface); color: var(--ink); border-radius: var(--r-m); overflow: hidden; }
.tk-stub { flex: none; width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--sunken); font-variant-numeric: tabular-nums; border-right: 2px dashed var(--line-strong); position: relative; }
.tk-stub b { font-size: 18px; font-weight: 760; }
.tk-stub span { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.tk-stub span::before { content: "~"; margin-right: 1px; }
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--stove); }
.tk-stub::before { top: -8px; } .tk-stub::after { bottom: -8px; }
.tk-main { flex: 1; min-width: 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px; }
.tk-label { font-size: 12.5px; font-weight: 700; color: var(--heat-ink); letter-spacing: .02em; }
.ticket.quiet .tk-label, .ticket.empty .tk-label { color: var(--ink-2); }
.tk-title { font-size: 19px; font-weight: 740; line-height: 1.35; }
.tk-meta { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tk-meta .ic { width: 15px; height: 15px; }
.tk-left { font-size: 15px; font-weight: 700; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
.ticket.quiet .btn, .ticket.empty .btn { margin-top: 10px; }
.ticket .btn { min-height: 48px; }

/* 주간 줄 */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wk-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 0 6px; border-radius: 12px; min-height: 64px; transition: background-color .2s var(--ease); }
.wk-d { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.wk-n { font-size: 17px; font-weight: 700; }
.wk-m { height: 16px; display: grid; place-items: center; }
.wk-cell.today .wk-n { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.wk-cell.sel { background: var(--ink); color: var(--surface); }
.wk-cell.sel .wk-d { color: var(--line); }
.dm { display: inline-grid; place-items: center; }
.dm.heat { width: 8px; height: 8px; border-radius: 50%; background: var(--heat-3); }
.dm.heat.live { box-shadow: 0 0 0 3px rgba(223, 122, 44, .28); }
.dm.plain { width: 7px; height: 7px; border-radius: 50%; border: 1.6px solid var(--ink-2); }
.dm.ok, .dm.bad { width: 16px; height: 16px; border-radius: 50%; color: var(--surface); }
.dm.ok { background: var(--success); } .dm.bad { background: var(--danger); }
.dm .ic { width: 11px; height: 11px; stroke-width: 3; }
.sel .dm.plain { border-color: var(--surface); }

/* 목록 */
.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.row-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-height: 64px; }
.row-mark { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.row-mark .ic { width: 18px; height: 18px; }
.mk-heat { color: var(--hc); background: var(--sunken); }
.mk-live { color: var(--hc); background: var(--sunken); box-shadow: inset 0 0 0 2px var(--hc); }
.mk-live .ic { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }
.mk-ok { background: var(--success); color: var(--surface); }
.mk-bad { background: var(--danger); color: var(--surface); }
.mk-late { color: var(--heat-ink); background: #F4E0D3; }
.mk-past { color: var(--ink-2); background: var(--sunken); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { font-size: 16px; font-weight: 640; line-height: 1.4; }
.row-title.is-done { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row-meta { font-size: 13px; color: var(--ink-2); line-height: 1.5; font-variant-numeric: tabular-nums; }
.row-side { flex: none; font-size: 13px; font-weight: 650; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; max-width: 38%; }

/* ---------- 시트 ---------- */

.field-err { display: flex; align-items: flex-start; gap: 6px; color: var(--danger); font-size: 13.5px; font-weight: 600; margin-top: 8px; line-height: 1.5; }
.field-err .ic { width: 17px; height: 17px; margin-top: 1px; }
.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px; border-radius: var(--r-m); border: 1.5px solid var(--line-strong); min-height: 96px; text-align: left; transition: border-color .2s var(--ease), background-color .2s var(--ease); }
.type-opt b { font-size: 15px; font-weight: 720; line-height: 1.35; }
.type-opt span { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.type-opt .ic { width: 20px; height: 20px; margin-bottom: 4px; color: var(--ink-2); }
.type-opt.on { border-color: var(--ink); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--ink); }
.type-opt.on .ic { color: var(--ink); }
.type-opt[data-v="jab"].on .ic { color: var(--heat-4); }
.type-opt:disabled:not(.on) { opacity: .45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sub-label + .chips { margin-top: 0; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line-strong); font-size: 14px; font-weight: 620; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.day { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line-strong); font-size: 14.5px; font-weight: 680; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0; }
.day.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.stepper { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 2px; }
.stepper b { min-width: 76px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .icon-btn { font-size: 20px; font-weight: 700; }
.summary { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; font-weight: 680; font-variant-numeric: tabular-nums; }
.summary .ic { width: 17px; height: 17px; color: var(--ink-2); }
.heat-pick { display: flex; flex-direction: column; gap: 10px; }
.heat-preview { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: center; padding: 10px 12px 10px 6px; border-radius: var(--r-m); background: var(--stove); color: var(--on-stove); }
.heat-preview .stage-chip { background: var(--stove-2); color: var(--on-stove); }
.hp-deg { display: flex; align-items: center; gap: 10px; }
.hp-desc { font-size: 13.5px; color: var(--on-stove-2); margin-top: 6px; line-height: 1.5; }
.hp-sample { font-size: 13.5px; font-weight: 650; margin-top: 4px; line-height: 1.5; }
.slider-wrap { position: relative; padding: 6px 0 22px; }
.slider-track { position: absolute; left: 0; right: 0; top: 17px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); }
.slider-track i { position: absolute; top: 0; bottom: 0; background: var(--hc); }
.slider-lock { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(251, 248, 242, .78) 0 4px, rgba(251, 248, 242, .45) 4px 8px); }
.slider { position: relative; width: 100%; height: 32px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 32px; background: transparent; }
.slider::-moz-range-track { height: 32px; background: transparent; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); margin-top: 1px; box-shadow: 0 1px 3px rgba(38, 33, 28, .25); }
.slider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }
.slider:focus-visible { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(38, 33, 28, .22); }
.slider-scale { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.slider-scale span { position: absolute; transform: translateX(2px); white-space: nowrap; }
.compare { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; padding: 10px 12px; border-radius: 12px; background: #F4E0D3; color: #6B2A16; margin-top: 4px; }
.compare .ic { width: 17px; height: 17px; margin-top: 1px; color: var(--heat-ink); }

/* ---------- 결과 ---------- */
.result { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--canvas); animation: resIn .4s var(--ease) both; }
@keyframes resIn { from { opacity: 0; transform: translate3d(0, 24px, 0); } to { opacity: 1; transform: none; } }
.res-scroll { flex: 1; overflow-y: auto; padding: calc(var(--safe-top) + 18px) 20px 18px; }
.res-top { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 18px 12px 10px; border-radius: var(--r-l); background: var(--success-soft); }
.result.r-bad .res-top { background: var(--stove); }
.res-top .stamp { --stamp-bg: transparent; flex: none; }
.result.r-bad .res-top .stamp { color: #EE8B70; }
.res-title { font-size: 21px; font-weight: 760; text-align: center; margin-top: 18px; line-height: 1.35; }
.res-title:focus { outline: none; }
.res-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-top: 16px; border-top: 1px solid var(--line); }
.res-facts div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.res-facts dt { font-size: 12.5px; color: var(--ink-2); }
.res-facts dd { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.floor-change { margin-top: 16px; padding: 14px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.floor-change.up { border-color: #E9BDAF; background: #FBEFE9; }
.fc-title { display: flex; align-items: center; gap: 6px; font-weight: 720; font-size: 15px; }
.fc-title .ic { width: 18px; height: 18px; color: var(--heat-ink); }
.fc-note { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }
.fbars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.fbar { display: grid; grid-template-columns: 36px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fbar b { color: var(--ink); text-align: right; font-size: 15px; }
.fbar.now b { color: var(--heat-ink); }
.fb-track { height: 12px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.fb-track i { display: block; height: 100%; background: var(--hc); border-radius: 6px; transform-origin: left; animation: grow .6s var(--ease) .2s both; }
@keyframes grow { from { transform: scaleX(0); } }
.streak { display: flex; gap: 6px; margin-top: 10px; }
.streak i { flex: 1; height: 8px; border-radius: 4px; background: var(--sunken); }
.streak i.on { background: var(--success); }
.res-actions { padding: 12px 20px calc(var(--safe-bottom) + 14px); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }

/* ---------- 딴짓 팝업 ---------- */
.pop-scrim { position: absolute; inset: 0; display: flex; align-items: flex-end; background: rgba(30, 26, 23, .62); animation: fade .2s var(--ease) both; padding: 12px 12px calc(var(--safe-bottom) + 12px); }
.popup { width: 100%; border-radius: 22px; background: var(--stove); color: var(--on-stove); padding: 16px 16px 16px; animation: popIn .38s var(--ease-bounce) both; }
@keyframes popIn { from { opacity: 0; transform: translate3d(0, 40px, 0) scale(.96); } to { opacity: 1; transform: none; } }
.pop-src { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--on-stove-2); font-weight: 600; }
.pop-src .ic { width: 16px; height: 16px; }
.pop-src b { margin-left: auto; color: var(--on-stove); padding: 2px 8px; border-radius: 6px; background: var(--stove-2); }
.pop-persona { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; margin: 10px 0 12px; }
.pop-line { font-size: 19px; font-weight: 720; line-height: 1.45; }
.pop-result { font-size: 13.5px; color: var(--on-stove-2); margin-bottom: 12px; }
.pop-choices { display: flex; flex-direction: column; gap: 8px; }
.popup .opt { border: 1.5px solid var(--stove-line); border-radius: 14px; padding: 10px 14px; background: var(--stove-2); }
.popup .opt small { color: var(--on-stove-2); }
.popup .btn.primary { background: var(--on-stove); color: var(--ink); }

/* ---------- 토스트 ---------- */
#toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 76px); z-index: 60; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--surface); font-size: 14.5px; font-weight: 600; line-height: 1.5; opacity: 0; transform: translate3d(0, 10px, 0); pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease); }
#toast.show { opacity: 1; transform: none; }
#app.no-tabs #toast, #app.layer-open #toast { bottom: auto; top: calc(var(--safe-top) + 8px); transform: translate3d(0, -10px, 0); }
#app.no-tabs #toast.show, #app.layer-open #toast.show { transform: none; }

/* ---------- 시연 콘솔 (앱 밖) ---------- */
#console { font-size: 13.5px; color: #2E2A26; }
.cs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-bottom: 10px; border-bottom: 2px solid #2E2A26; }
.cs-head b { font-size: 16px; }
.cs-head p { font-size: 12px; color: #6A6157; }
.cs-x { display: none; width: 40px; height: 40px; place-items: center; border-radius: 10px; }
.cs-sec { padding: 12px 0; border-bottom: 1px solid #CFC5B5; }
.cs-sec h3 { font-size: 12.5px; font-weight: 700; color: #6A6157; margin-bottom: 8px; letter-spacing: .02em; }
.cs-clock { font-size: 15px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.cs-clock b { font-size: 22px; font-weight: 760; margin-left: 4px; }
.cs-grid { display: grid; gap: 6px; margin-bottom: 6px; }
.cs-grid.five { grid-template-columns: repeat(5, 1fr); }
.cs-grid.two { grid-template-columns: 1fr 1fr; }
.cs-btn { min-height: 40px; padding: 4px 6px; border-radius: 9px; background: #FFFDF8; border: 1.2px solid #CFC5B5; font-size: 12.5px; font-weight: 650; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.cs-btn small { font-size: 10.5px; color: #6A6157; font-weight: 600; }
.cs-btn.ghost { background: transparent; }
.cs-btn.block { width: 100%; margin-top: 6px; }
.cs-btn.danger { color: #9E281A; border-color: #E0B4A8; }
.cs-btn.danger.armed { background: #9E281A; color: #FFFDF8; }
.cs-row { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 6px; }
.cs-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-weight: 650; font-size: 12.5px; }
.cs-toggle i { width: 34px; height: 20px; border-radius: 10px; background: #CFC5B5; position: relative; flex: none; transition: background-color .2s var(--ease); }
.cs-toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFDF8; transition: transform .2s var(--ease); }
.cs-toggle.on i { background: #2E2A26; }
.cs-toggle.on i::after { transform: translateX(14px); }
.cs-radios { display: flex; flex-direction: column; gap: 0; }
.cs-radio { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 12.5px; cursor: pointer; line-height: 1.35; }
.cs-radio input { accent-color: #2E2A26; width: 16px; height: 16px; flex: none; }
.cs-note { font-size: 12px; color: #6A6157; margin-top: 6px; line-height: 1.5; }
.cs-state div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 12.5px; }
.cs-state dt { color: #6A6157; flex: none; }
.cs-state dd { text-align: right; font-weight: 600; }
.cs-steps { list-style: decimal; padding-left: 20px; font-size: 12.5px; color: #4A433C; line-height: 1.65; }
#console-tab { display: none; }

@media (min-width: 900px) and (min-height: 700px) {
  #console { width: 340px; max-height: calc(100dvh - 48px); overflow-y: auto; padding: 16px 18px; border-radius: 18px; background: #EDE6DA; border: 1px solid #D3C9B9; flex: none; }
}
@media not ((min-width: 900px) and (min-height: 700px)) {
  #console { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); z-index: 100; overflow-y: auto; padding: calc(var(--safe-top) + 14px) 16px 24px; background: #EDE6DA; transform: translate3d(100%, 0, 0); transition: transform .3s var(--ease); box-shadow: -8px 0 24px rgba(30, 26, 23, .18); visibility: hidden; }
  body.console-open #console { transform: none; visibility: visible; }
  .cs-x { display: grid; }
  #console-tab { display: flex; position: fixed; right: 0; top: 38%; z-index: 90; writing-mode: vertical-rl; padding: 8px 2px; min-height: 48px; opacity: .6; touch-action: none; user-select: none; align-items: center; justify-content: center; border-radius: 10px 0 0 10px; background: rgba(46, 42, 38, .78); color: #FFFDF8; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; }
}

/* ---------- 움직임 줄이기 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
html.reduce *, html.reduce *::before, html.reduce *::after { animation: none !important; transition: none !important; }



/* ---------- 미루먼지 배치 ---------- */
.login-mascot { flex: 1; display: grid; place-items: center; min-height: 190px; padding: 10px 0; }
.login-mascot .mireum { width: min(230px, 60vw); }
.tag-sub { font-size: 14px; color: var(--on-stove-2); margin-top: 6px; line-height: 1.6; }
.onb-mascot { display: grid; place-items: center; padding: 6px 0 2px; }
.onb-mascot .mireum { width: min(180px, 48vw); }
.persona-mascot { display: block; width: 100%; max-width: 176px; padding: 0; border-radius: 20px; touch-action: manipulation; }
.persona-mascot:focus-visible { outline: 2px solid var(--on-stove); outline-offset: 2px; }
.fx-mascot { max-width: 216px; justify-self: center; width: 100%; }
.empty-block .mireum { width: 132px; }
.res-mascot { width: 136px; flex: none; }
.hp-mascot .mireum { width: 100%; }
.pips { display: flex; gap: 4px; margin: 0 0 8px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--stove-line); }
.pips i.on { background: var(--hc); }
.fx-temp .pips { margin: 10px 0 0; }
/* 말풍선 + 소리 버튼 */
.speech-wrap { position: relative; margin: 0 20px 14px; }
.speech-wrap .speech { margin: 0; padding-right: 52px; }
.fx-speech .speech-wrap { margin: 0 20px; }
.say-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--on-stove-2); }
.say-btn.on-dark:hover { color: var(--on-stove); background: rgba(243, 236, 224, .08); }
.say-btn .ic { width: 20px; height: 20px; }
/* 캐릭터 터치 메뉴바 */
.p-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: -4px 20px 14px; }
.p-menu.fresh { animation: menuIn .28s var(--ease) both; }
@keyframes menuIn { from { opacity: 0; transform: translate3d(0, -8px, 0); } to { opacity: 1; transform: none; } }
.p-menu-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; padding: 8px 4px; border-radius: 14px; background: var(--stove-2); color: var(--on-stove); font-size: 12px; font-weight: 650; line-height: 1.3; text-align: center; }
.p-menu-item .ic { width: 20px; height: 20px; }
/* 주간 → 월간 쓸기 */
.wk-swipe { touch-action: pan-y; }
.wk-hint { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; color: #8A7F72; margin-top: 4px; }
.wk-hint .ic { width: 14px; height: 14px; }
/* 상단 추가 화면 (일정 등록) — 위에서 아래로 */
.sheet.from-top { top: 0; bottom: auto; height: calc(100% - 28px); border-radius: 0 0 22px 22px; animation: sheetDown .38s var(--ease) both; }
.sheet.from-top .grab { order: 9; margin: 0 auto 8px; }
.sheet.from-top .sheet-head { padding-top: calc(var(--safe-top) + 4px); }
.sheet.from-top .sheet-foot { padding-bottom: 14px; }
@keyframes sheetDown { from { transform: translate3d(0, -100%, 0); } to { transform: none; } }
.form-tip { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 4px; border-radius: 14px; background: var(--sunken); margin: 8px 0 4px; }
.form-tip p { font-size: 13.5px; line-height: 1.55; font-weight: 560; }
.tip-mascot { flex: none; width: 54px; }
/* 스크롤 휠 */
.wheels { position: relative; display: flex; gap: 8px; padding: 0 4px; margin-top: 2px; border-radius: 14px; background: var(--field); border: 1.5px solid var(--line-strong); }
.wheels::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 44px; margin-top: -22px; border-radius: 10px; background: var(--sunken); pointer-events: none; }
.wheel-col { position: relative; flex: 1; display: flex; align-items: center; min-width: 0; }
.wheels.dl .wheel-col:first-child, .wheels.one .wheel-col { flex: 2.2; }
.wheel { position: relative; flex: 1; height: 132px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; mask-image: linear-gradient(transparent, #000 34%, #000 66%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 34%, #000 66%, transparent); border-radius: 10px; }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.wheel-pad { height: 44px; }
.wheel-item { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 17px; font-weight: 560; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
.wheel-item.sel { color: var(--ink); font-weight: 760; }
.wheel-unit { flex: none; font-size: 14px; color: var(--ink-2); font-weight: 650; padding-right: 6px; }
/* 옷장 */
.closet-row-inline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.cos-opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 8px; border-radius: 14px; border: 1.5px solid transparent; text-align: center; }
.cos-opt b { font-size: 12px; font-weight: 700; }
.cos-opt small { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.cos-art { display: block; width: 100%; max-width: 72px; }
.on-stove .cos-opt { color: var(--on-stove); }
.on-stove .cos-opt.on { border-color: var(--on-stove); background: var(--stove-2); }
.cos-opt.on { border-color: var(--ink); background: var(--sunken); }
.closet-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 12px; }
.closet-preview .mireum { width: 150px; }
.closet-preview p { font-size: 14px; color: var(--ink-2); }
.closet-preview b { color: var(--ink); }
.closet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.closet-grid .cos-art { max-width: 84px; }
.closet-row .closet-thumb { width: 44px; flex: none; }
/* 월간 달력 시트 (하단 추가 화면) */
.month-sheet .mo-cell { min-height: 46px; }
/* 실시간 알림 배너 */
#layer-banner { position: absolute; left: 10px; right: 10px; top: calc(var(--safe-top) + 6px); z-index: 70; pointer-events: none; }
#layer-banner .banner { pointer-events: auto; width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 6px 20px -6px rgba(38, 33, 28, .35); border: 1px solid var(--line); text-align: left; opacity: 0; transform: translate3d(0, -16px, 0); transition: opacity .25s var(--ease), transform .3s var(--ease); }
#layer-banner.show .banner { opacity: 1; transform: none; }
#layer-banner:not(.show) .banner { pointer-events: none; }
.bn-mascot { width: 46px; flex: none; }
.bn-text { display: flex; flex-direction: column; font-size: 14px; line-height: 1.45; }
.bn-text b { font-size: 12px; color: var(--ink-2); font-weight: 700; }

/* ---------- 마우스 환경에서만 hover ---------- */
@media (hover: hover) {
  .p-menu-item:hover { background: #453D36; }
  .cos-opt:hover { background: var(--sunken); }
  .on-stove .cos-opt:hover { background: var(--stove-2); }
  .btn.primary:hover:not(:disabled) { background: var(--ink-hover); }
  .btn.secondary:hover { background: var(--sunken); }
  .btn.ghost:hover { background: var(--sunken); color: var(--ink); }
  .btn.danger:hover { background: #9E281A; }
  .btn.danger-outline:hover { background: var(--danger-soft); }
  .btn.light:hover { background: #FFFFFF; }

}

/* ---------- 진짜 안드로이드 앱 (html.native) ---------- */

.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Capacitor가 넣어 주는 안전 영역 변수도 함께 쓴다 (상태 표시줄·제스처 바 아래로 내용이 숨지 않게) */
html.native { --safe-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)); }

.sub-row .sub-label { margin: 0; }
.in-link { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 4px; font-size: 13px; font-weight: 650; color: var(--ink-2); }

.in-box { position: absolute; left: 14px; right: 14px; top: calc(var(--safe-top) + 64px); background: var(--surface); border-radius: 18px; padding: 18px 16px 14px; box-shadow: 0 18px 40px rgba(38, 33, 28, .28); animation: popIn .3s var(--ease-bounce) both; }

/* ---------- 로그인 상태 (나 탭) · 성공 안내 · 개발자 진단 ---------- */

.banner.login-ok { display: flex; align-items: center; gap: 12px; cursor: default; }

.avatar.sm { width: 40px; height: 40px; font-size: 16px; flex: none; }

.dg-ok .dg-ic { background: var(--success-soft); color: var(--success); } .dg-ok b { color: var(--success); }
.dg-bad .dg-ic { background: var(--danger-soft); color: var(--danger); } .dg-bad b { color: var(--danger); }
.dg-sim .dg-ic { background: var(--sunken); color: var(--ink-2); } .dg-sim b { color: var(--ink-2); }

/* =========================================================
   v5 — 캘린더 일·주·월 · 한 폼 등록(빠른 → 상세) · 추가 버튼 하나
   ========================================================= */
/* 일정 색 (일정마다 고름) */
.c-coral { --ev: #E58A6E; --ev-soft: #FBE3DA; } .c-sun { --ev: #E2B04A; --ev-soft: #FBEFD2; }
.c-mint { --ev: #5FAE8E; --ev-soft: #DDF0E6; } .c-sky { --ev: #6FA3D6; --ev-soft: #DFEBF7; }
.c-lilac { --ev: #A48BD0; --ev-soft: #ECE5F7; } .c-stone { --ev: #9A8F82; --ev-soft: #ECE7E0; }
.wd0 { color: #C2503A; } .wd6 { color: #4F78B8; }
.mo-head .wd0, .mo-head .wd6 { font-weight: 700; }
/* 추가 버튼 — 오늘·달력 화면 오른쪽 아래 하나 */
.fab { position: absolute; right: 18px; bottom: calc(78px + var(--safe-bottom)); z-index: 30; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(38, 33, 28, .28); }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.94); }
#app.no-tabs #fab-slot { display: none; }
/* 달력 상단 */
.seg.three button { padding: 0 18px; }
.cal-bar .btn[disabled] { opacity: .45; }
.cal-swipe { touch-action: pan-y; }
/* 월간: 날짜 칸 안에 일정 제목 조각 */
/* 월간: 주 한 줄 = 날짜 칸 7개(뒤 판) + 그 위에 이어 그린 일정 막대 */
.mo-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 30px repeat(3, 17px) 4px; border-bottom: 1px solid var(--line); }
.mo-week .mo-cell { grid-row: 1 / -1; justify-content: flex-start; align-items: center; min-height: 0; padding: 3px 0 0; border-bottom: 0; }
.mo-cell .mo-n { align-self: center; width: 26px; height: 26px; font-size: 13.5px; }
.mo-cell.wd0 .mo-n { color: #C2503A; } .mo-cell.wd6 .mo-n { color: #4F78B8; }
.mo-cell.out .mo-n { color: #B9AFA2; }
.mo-cell.sel .mo-n { color: var(--surface); }
.mo-cell.range-a .mo-n { background: #E58A6E; color: #fff; }
.mo-chips { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mo-chip { display: block; min-width: 0; height: 15px; padding: 0 3px; border-radius: 3px; background: var(--ev-soft); border-left: 2.5px solid var(--ev); font-size: 10px; line-height: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.mo-chip.cont { border-left-width: 0; border-radius: 0 3px 3px 0; }
.mo-chip.done { opacity: .55; text-decoration: line-through; }
.mo-chip.bad { box-shadow: inset 0 0 0 1px var(--danger); }
.mo-bar { grid-row: 2; align-self: center; min-width: 0; height: 15px; margin: 0 2px; padding: 0 3px; border-radius: 3px; background: var(--ev-soft); border-left: 2.5px solid var(--ev); font-size: 10px; line-height: 15px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; pointer-events: none; }
.mo-bar.multi { border-left: 0; padding: 0 4px; text-align: center; font-weight: 700; } /* 여러 날 일정: 이어진 막대 + 제목 가운데 */
.mo-bar.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; } /* 지난주에서 이어짐 */
.mo-bar.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; } /* 다음 주로 이어짐 */
.mo-bar.done { opacity: .55; text-decoration: line-through; }
.mo-bar.bad { box-shadow: inset 0 0 0 1px var(--danger); }
.mo-more { grid-row: 4; align-self: center; font-size: 10px; font-weight: 650; color: var(--ink-2); text-align: center; line-height: 15px; pointer-events: none; }
.range-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 8px; border-radius: var(--r-s); background: #FBE3DA; font-size: 14px; }
.range-bar span { flex: 1; }
/* 주간 */
.ag-empty { color: #A69B8D; font-size: 13px; padding: 8px 0; }
/* 일간 시간표 */
.tg-tip { margin: 4px 0 8px; }
.tg-allday { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.tg-allday > div { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tg-allday .mo-chip { height: 24px; line-height: 24px; font-size: 12.5px; padding: 0 8px; }
.tgrid { position: relative; }
.tg-rows { display: flex; flex-direction: column; }
.tg-slot { height: 44px; border-top: 1px solid var(--line); display: flex; align-items: flex-start; padding-left: 0; }
.tg-slot.picked { background: #FBE3DA; }
.tg-h { width: 44px; flex: none; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; transform: translateY(-1px); }
.tg-evs { position: absolute; top: 0; bottom: 0; left: 48px; right: 0; pointer-events: none; }
.tg-ev { position: absolute; pointer-events: auto; border-radius: 6px; background: var(--ev-soft); border-left: 3px solid var(--ev); padding: 2px 6px; overflow: hidden; display: flex; flex-direction: column; text-align: left; font-size: 12px; line-height: 1.3; }
.tg-ev b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-ev span { color: var(--ink-2); font-size: 11px; }
.tg-ev.done { opacity: .55; }
.tg-now { position: absolute; left: -6px; right: 0; height: 2px; background: var(--danger); }
.tg-now::before { content: ""; position: absolute; left: 0; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
/* 목록 줄 왼쪽 색 띠 */
.row[class*="c-"] { position: relative; }
.row[class*="c-"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ev); }
/* 등록 폼 */
.when .allday { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.switch.sm { width: 44px; height: 26px; }
.switch.sm i { width: 20px; height: 20px; }
.switch.sm.on i { transform: translateX(18px); }
.switch[disabled] { opacity: .4; }
.when-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; margin-top: 8px; border-radius: var(--r-s); background: var(--field); border: 1.5px solid var(--line); }
.when-row.open { border-color: var(--ink); }
.wr-label { width: 34px; font-size: 13px; color: var(--ink-2); font-weight: 650; }
.wr-date { flex: 1; font-weight: 680; }
.wr-time { font-size: 18px; font-weight: 720; font-variant-numeric: tabular-nums; }
.picker { margin-top: 6px; padding: 6px 4px 8px; border-radius: var(--r-s); background: var(--sunken); }
.quick-dur { margin-top: 8px; }
.more-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 50px; padding: 0 14px; margin: 4px 0 8px; border-radius: var(--r-s); border: 1.5px dashed var(--line-strong); font-size: 14px; font-weight: 650; color: var(--ink-2); }
.more-btn svg { width: 18px; height: 18px; transform: rotate(90deg); }
.more-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
.seg.wide.three button { flex: 1; padding: 0 6px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; background: var(--ev); display: grid; place-items: center; color: #fff; }
.sw.on { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ev); }
.sw svg { width: 18px; height: 18px; }
textarea.txt.memo { height: auto; min-height: 64px; padding: 10px 14px; resize: vertical; line-height: 1.5; }
.in-links { display: inline-flex; gap: 4px; }
.switch.sm::before { inset: -8px 0; }
.speech-fact { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 600; opacity: .72; letter-spacing: -.1px; }
.bn-text small { display: block; font-size: 12px; opacity: .7; font-weight: 600; }
/* 등록 폼: 시작 → 종료 한 줄 + 폼 안 달력 (삼성 캘린더 방식) */
.wb-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; margin-top: 8px; }
.wb-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wb-label { font-size: 12px; color: var(--ink-2); font-weight: 650; }
.wb-arrow { color: var(--ink-2); font-size: 20px; padding-top: 14px; }
.wb-date, .wb-time { min-height: 40px; padding: 0 14px; border-radius: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-date { font-size: 16px; }
.wb-time { font-size: 20px; }
.wb-time.muted { color: var(--ink-2); font-size: 15px; display: grid; place-items: center; min-height: 40px; }
.wb-date.on, .wb-time.on { background: var(--ink); color: var(--surface); }
.fcal { margin-top: 10px; padding: 8px 4px 10px; border-radius: var(--r-m); background: var(--field); border: 1px solid var(--line); touch-action: pan-y; }
.fcal-nav { display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.fcal-nav b { flex: 1; text-align: center; font-size: 16px; }
.fcal-tip { text-align: center; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; }
.fcal-head, .fcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.fcal-head span { text-align: center; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.fcal-head .wd0 { color: #C2503A; } .fcal-head .wd6 { color: #4F78B8; }
.fcal-cell { height: 40px; display: grid; place-items: center; position: relative; font-weight: 640; font-variant-numeric: tabular-nums; }
.fcal-cell span { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; position: relative; z-index: 1; }
.fcal-cell.wd0 { color: #C2503A; } .fcal-cell.wd6 { color: #4F78B8; }
.fcal-cell.out { opacity: .4; }
.fcal-cell[disabled] { opacity: .25; }
.fcal-cell.today span { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
/* 기간: 시작~끝을 하나의 알약 띠로 */
.fcal-cell.in::before, .fcal-cell.ra::before, .fcal-cell.rb::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 0; right: 0; background: #D9CCF2; }
.fcal-cell.ra::before { left: 50%; } .fcal-cell.rb::before { right: 50%; }
.fcal-cell.a span, .fcal-cell.b span { background: #A48BD0; color: #fff; }
/* 폼 아래 취소 · 저장 알약 */
.pill-actions { display: flex; align-items: center; margin: 0 auto; width: min(100%, 320px); min-height: 54px; border-radius: 27px; background: var(--ink); color: var(--surface); box-shadow: 0 6px 18px rgba(38, 33, 28, .22); }
.pill-actions button { flex: 1; min-height: 54px; text-align: center; font-size: 16px; font-weight: 650; color: var(--on-stove-2); }
.pill-actions button.save { color: var(--surface); font-weight: 760; }
.pill-actions i { width: 1px; height: 22px; background: var(--stove-line); }
.hint.note { background: var(--sunken); border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.hint.note.top { margin: 0 0 10px; }

/* =========================================================
   미루먼지 스타일과 동작 (transform·opacity만 움직인다)
   ========================================================= */
.mireum { display: block; width: 100%; height: auto; overflow: visible; --m-body: #FFF6E8; --m-line: #6E5548; --m-face: #2E2420; --m-cheek: #F4ADAD; --m-shadow: rgba(43, 38, 34, .12); }
.on-stove .mireum, .stove-band .mireum, .popup .mireum, .heat-preview .mireum, .result.r-bad .mireum { --m-shadow: rgba(10, 8, 7, .32); }
.mireum .mr-shadow { fill: var(--m-shadow); }
.mireum .mr-body, .mireum .mr-tuft, .mireum .mr-foot, .mireum .mr-arm { fill: var(--m-body); stroke: var(--m-line); stroke-width: 2.7; stroke-linejoin: round; stroke-linecap: round; }
/* 파스텔 수채화 느낌: 가장자리 쪽만 살짝 어둡게(광택·글로우 없음) + 손그림처럼 살짝 어긋난 두 번째 선 */
.mireum .mr-sketch { fill: none; stroke: var(--m-line); stroke-width: 1.1; opacity: .3; stroke-linejoin: round; }
.mireum .mr-face .soft { stroke-width: 2; opacity: .6; }
.mireum .mr-dust circle { fill: #D9CBB9; opacity: .8; }
.mireum .mr-dust .d1 { fill: #CBB9E3; } .mireum .mr-dust .d2 { fill: #E8C7B4; }
.mireum .fx-blush path { stroke: #E88B8B; stroke-width: 2.2; }
.mireum .mr-curl { fill: none; stroke: var(--m-line); stroke-width: 2.2; stroke-linecap: round; }
.mireum .mr-face path, .mireum .mr-brows path { fill: none; stroke: var(--m-face); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mireum .mr-face .f { fill: var(--m-face); stroke: none; }
.mireum .mr-face .hl { fill: #FFFFFF; }
.mireum .mr-face .thick { stroke-width: 3.8; }
.mireum .mr-face .tongue { fill: #F08A8A; stroke: none; }
.mireum .mr-cheek { fill: var(--m-cheek); opacity: .75; }
.mireum.e-angry .mr-cheek, .mireum.e-furious .mr-cheek { fill: #EE8D7E; opacity: .85; }
.mireum.e-sleepy .mr-cheek { opacity: .55; }
/* 효과 */
.mireum .mr-fx path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mireum .fx-spark path { fill: #F3CF62; stroke: none; }
.mireum .fx-q path { stroke: var(--m-line); stroke-width: 4; }
.mireum .fx-q .dot, .mireum .fx-bang .dot { fill: var(--m-line); }
.mireum .fx-bang path { stroke: var(--m-line); stroke-width: 4.2; }
.mireum .fx-vein path { stroke: #E5735F; stroke-width: 4; }
.mireum .fx-steam path { stroke: #BFB2A2; stroke-width: 4.5; }
.on-stove .mireum .fx-steam path, .stove-band .mireum .fx-steam path { stroke: #D9CFC0; }
.mireum .fx-gloom path { stroke: #A99BD8; stroke-width: 3; opacity: .75; }
.mireum .fx-sweat path { fill: #9CC6EC; stroke: none; }
.mireum .fx-tears path { stroke: #9CC6EC; stroke-width: 4; }
.mireum .fx-tears .drop { fill: #9CC6EC; stroke: none; }
.mireum .fx-zz path { stroke: #A99BD8; stroke-width: 3.6; }
/* 소품 */
.mireum .prop-clip .wood { fill: #E9C9A0; stroke: var(--m-line); stroke-width: 3; }
.mireum .prop-clip .paper { fill: #FFFDF8; stroke: none; }
.mireum .prop-clip .clip { fill: #B8A587; stroke: var(--m-line); stroke-width: 2.4; }
.mireum .prop-clip .tick { fill: none; stroke: #8F82C8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mireum .prop-clip .ln { stroke: #D8CFC2; stroke-width: 3; stroke-linecap: round; }
.mireum .prop-flag .pole { stroke: var(--m-line); stroke-width: 3.4; stroke-linecap: round; fill: none; }
.mireum .prop-flag .cloth { fill: #F6DE8D; stroke: var(--m-line); stroke-width: 2.6; stroke-linejoin: round; }
.mireum .prop-flag .star { fill: #FFFDF8; }
/* ---------- 동작 ---------- */
.mireum .mr-all, .mireum .mr-scale, .mireum .mr-arm-r, .mireum .mr-arm-l, .mireum .mr-eyes, .mireum .mr-fx { transform-box: view-box; }
.mireum .mr-all { transform-origin: 120px 200px; }
.mireum .mr-scale { transform-origin: 120px 200px; transition: transform .5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.mireum .mr-scale.squash { transform: scale(1.06, .9) !important; }
.mireum .mr-eyes { transform-origin: 120px 141px; }
.mireum .mr-arm-r { transform-origin: 186px 128px; }
.mireum .mr-arm-l { transform-origin: 54px 128px; }
/* 숨쉬기 (기본 대기) + 눈 깜빡임 */
.mireum.m-breathe .mr-all { animation: mrBreathe 3.2s ease-in-out infinite; }
.mireum.e-default .mr-eyes, .mireum.e-focus .mr-eyes, .mireum.e-surprised .mr-eyes { animation: mrBlink 4.6s infinite; }
@keyframes mrBreathe { 0%, 100% { transform: none; } 50% { transform: translate3d(0, -2px, 0) scale(1.012, .99); } }
@keyframes mrBlink { 0%, 94%, 100% { transform: none; } 96% { transform: scaleY(.12); } }
/* 둘러보기 (일정 없음·기다림) */
.mireum.m-look .mr-eyes { animation: mrLook 5s ease-in-out infinite; }
.mireum.m-look .mr-all { animation: mrBreathe 3.6s ease-in-out infinite; }
@keyframes mrLook { 0%, 30%, 100% { transform: none; } 40%, 55% { transform: translate3d(-5px, 0, 0); } 65%, 80% { transform: translate3d(5px, -1px, 0); } }
/* 통통 튀기 (반가움) + 손 흔들기 */
.mireum.m-bounce .mr-all { animation: mrBounce 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
.mireum.p-wave .mr-arm-r { animation: mrWave .9s ease-in-out infinite alternate; }
@keyframes mrBounce { 0%, 60%, 100% { transform: none; } 20% { transform: translate3d(0, -10px, 0) scale(.98, 1.03); } 40% { transform: translate3d(0, 0, 0) scale(1.04, .96); } }
@keyframes mrWave { from { transform: rotate(-12deg); } to { transform: rotate(16deg); } }
/* 기뻐서 뛰어오르기 (성공) */
.mireum.m-jump .mr-all { animation: mrJump 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 2, mrBreathe 3.2s ease-in-out 2.2s infinite; }
.mireum.m-jump .fx-spark { animation: mrTwinkle 1.2s ease-in-out infinite; transform-origin: 120px 100px; }
@keyframes mrJump { 0%, 100% { transform: none; } 15% { transform: scale(1.06, .92); } 45% { transform: translate3d(0, -26px, 0) scale(.96, 1.05); } 75% { transform: scale(1.04, .96); } }
@keyframes mrTwinkle { 50% { opacity: .35; transform: scale(.9); } }
/* 화나서 부풀기 (마감 임박·반복 실패) */
.mireum.m-puff .mr-all { animation: mrPuff 1.6s ease-in-out infinite; }
.mireum.m-puff.e-furious .mr-all { animation: mrShake .2s linear infinite; }
.mireum .fx-vein { animation: mrVein 1s ease-in-out infinite; transform-origin: 178px 86px; }
.mireum .fx-steam .st { animation: mrSteam 1.3s ease-out infinite; transform-origin: center bottom; transform-box: fill-box; opacity: 0; }
.mireum .fx-steam .s1 { animation-delay: .6s; }
@keyframes mrPuff { 0%, 100% { transform: none; } 50% { transform: scale(1.03); } }
@keyframes mrShake { 0%, 100% { transform: none; } 25% { transform: translate3d(-1.5px, 0, 0); } 75% { transform: translate3d(1.5px, 0, 0); } }
@keyframes mrVein { 50% { transform: scale(.82); } }
@keyframes mrSteam { 0% { opacity: 0; transform: translate3d(0, 6px, 0) scale(.7); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate3d(0, -14px, 0) scale(1.1); } }
/* 잔소리하기 (팔 흔들기) */
.mireum.p-nag .mr-arm-r { animation: mrNag .45s ease-in-out infinite alternate; }
@keyframes mrNag { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }
/* 울면서 주저앉기 (실패) */
.mireum.m-cry .mr-all { animation: mrSit .6s cubic-bezier(0.16, 1, 0.3, 1) both, mrSob 1.2s ease-in-out .6s infinite; }
.mireum .fx-tears .drop { animation: mrDrop 1.4s ease-in infinite; transform-box: fill-box; }
@keyframes mrSit { from { transform: translate3d(0, -10px, 0); } to { transform: translate3d(0, 4px, 0); } }
@keyframes mrSob { 0%, 100% { transform: translate3d(0, 4px, 0); } 50% { transform: translate3d(0, 6px, 0) scale(1.01, .98); } }
@keyframes mrDrop { 0% { transform: translate3d(0, -4px, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate3d(0, 14px, 0); opacity: 0; } }
/* 잠들어 웅크리기 */
.mireum.m-sleep .mr-all { animation: mrSleep 4.4s ease-in-out infinite; }
.mireum .fx-zz path { animation: mrZ 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.mireum .fx-zz path + path { animation-delay: 1.3s; }
@keyframes mrSleep { 0%, 100% { transform: none; } 50% { transform: scale(1.02, .98); } }
@keyframes mrZ { 0%, 100% { opacity: .2; transform: translate3d(0, 4px, 0); } 50% { opacity: 1; transform: translate3d(2px, -4px, 0); } }
/* 쫓아오기 (딴짓 감지 팝업 등장) */
.mireum.m-chase .mr-all { animation: mrChase .7s cubic-bezier(0.16, 1, 0.3, 1) both, mrHop .32s ease-in-out .7s 3; }
@keyframes mrChase { from { transform: translate3d(140px, 0, 0) rotate(-8deg); } to { transform: none; } }
@keyframes mrHop { 50% { transform: translate3d(0, -6px, 0); } }
/* 체크리스트 확인 (일정 등록·집중) */
.mireum .prop-clip .tick { stroke-dasharray: 16; stroke-dashoffset: 16; }
.mireum.m-check .prop-clip .tick { animation: mrTick 3.6s ease-out infinite; }
.mireum.m-check .prop-clip .t2 { animation-delay: .45s; } .mireum.m-check .prop-clip .t3 { animation-delay: .9s; }
.mireum:not(.m-check) .prop-clip .tick { stroke-dashoffset: 0; }
.mireum.m-check .mr-all { animation: mrBreathe 3.2s ease-in-out infinite; }
@keyframes mrTick { 0% { stroke-dashoffset: 16; } 18%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 16; } }

/* 움직임 줄이기 */
@media (prefers-reduced-motion: reduce) {
  .mireum *, .mireum { animation: none !important; transition: none !important; }
  .mireum .prop-clip .tick { stroke-dashoffset: 0; }
  .mireum .fx-steam .st { opacity: .8; }
}
html.reduce .mireum .prop-clip .tick { stroke-dashoffset: 0; }
html.reduce .mireum .fx-steam .st { opacity: .8; }

'use strict';
/* =========================================================
   00-native: 지금 '진짜 안드로이드 앱' 안에서 실행 중인지 알아내고,
   앱에서만 쓰는 네이티브 플러그인 손잡이를 준비한다.
   - 브라우저(PWA·미리보기)에서는 NATIVE.on === false → 기존 동작 그대로
   ========================================================= */
const NATIVE = (() => {
  const C = (typeof window !== 'undefined' && window.Capacitor) || null;
  const on = !!(C && typeof C.isNativePlatform === 'function' && C.isNativePlatform());
  const ex = (typeof window !== 'undefined' && window.capacitorExports) || {};
  const reg = (name) => {
    if (!on || !C || typeof C.registerPlugin !== 'function') return null;
    try { return C.registerPlugin(name); } catch (e) { return null; }
  };
  return {
    on,                                   // 진짜 앱이면 true
    Kakao: reg('KakaoLogin'),             // 우리가 만든 카카오 로그인 플러그인 (KakaoLoginPlugin.kt)
    Notif: reg('LocalNotifications'),     // 시작·마감 알림 (앱이 꺼져 있어도 울림)
    Speech: reg('TextToSpeech'),          // 기기 음성으로 멘트 읽기
    App: reg('App'),                      // 뒤로 가기 버튼, 앱 다시 열림 감지
    Bars: on ? (ex.SystemBars || reg('SystemBars')) : null, // 상태 표시줄 글자색
  };
})();
if (NATIVE.on && typeof document !== 'undefined') document.documentElement.classList.add('native');

   ========================================================= */
'use strict';

const pad = (n) => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const MIN = 60000;
const DAY = 86400000;
/* 요일 값은 저장 형식 그대로 1=월 … 7=일 (기존 일정 데이터를 바꾸지 않기 위해).

const WD = ['', '월', '화', '수', '목', '금', '토', '일'];
const WEEK_ORDER = [7, 1, 2, 3, 4, 5, 6];
function dayRank(d) { return d % 7; } // 화면 순서: 일=0, 월=1 … 토=6

function ymd(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function at(dateStr, hm) { const d = parseYmd(dateStr); const [h, mi] = hm.split(':').map(Number); d.setHours(h, mi, 0, 0); return d.getTime(); }

  }
  if (c < 0xac00 || c > 0xd7a3) return word + b;
  const jong = (c - 0xac00) % 28;

/* ---------- 캐릭터 목록 ----------

   - voice               : TTS 목소리 { pitch 높낮이, rate 빠르기 } — 기기 목소리를 이 값으로 바꿔 캐릭터처럼 들리게
   - art(o)              : 그림 함수. o = { expr 표정, pose 자세, motion 동작, fluff 단계 0~1, label }
                           모양(실루엣)은 언제나 같다. 표정·자세·작은 동작·먼지 효과로만 감정을 보여 준다
                           표정·자세·동작 이름은 EXPR_LABEL·mascotFor()가 쓰는 이름을 그대로 그려 낸다
   (옷 갈아입기·변신 기능은 없앴다 — 디자인 기준) */
CHAR_MIREUM.scale = SCALES.mireum;

const CHARACTERS = { mireum: CHAR_MIREUM };
const DEFAULT_CHARACTER = 'mireum';
/* 회원에게 배정된 캐릭터 (없거나 지워진 id면 기본 캐릭터) */
function charOf(m = member()) { return CHARACTERS[m && m.characterId] || CHARACTERS[DEFAULT_CHARACTER]; }
/* 지금 화면에서 말하는 캐릭터 */
function persona() { return charOf(); }

/* 상황 키마다 마지막으로 고른 문장을 기억해 같은 문장 연속 반복을 피한다 */
const lineMemo = {};
function pickLine(ctx, arr, bucket = 0) {
  if (!arr || !arr.length) return { tpl: '', id: ctx };
  const m = lineMemo[ctx];
  if (m && m.bucket === bucket && m.len === arr.length) return { tpl: arr[m.idx], id: ctx + '#' + m.idx };
  let idx;
  if (arr.length === 1) idx = 0;
  else if (m) idx = (m.idx + 1 + Math.floor(Math.random() * (arr.length - 1))) % arr.length;
  else idx = Math.floor(Math.random() * arr.length);
  lineMemo[ctx] = { idx, bucket, len: arr.length };
  return { tpl: arr[idx], id: ctx + '#' + idx };
}
function fillLine(tpl, v) { return tpl.replace(/\{(\w+)\}/g, (_, k) => (v[k] ?? '')); }

function occKey(taskId, date) { return taskId + '|' + date; }
function splitKey(k) { const i = k.lastIndexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; }

function spanDays(task) { return task.endDate ? Math.max(0, daysBetween(task.date, task.endDate)) : 0; }
/* 반복 규칙: { kind: none|daily|weekly|monthly|yearly, every: N, days?: [1~7] }
   매월은 시작일과 같은 날짜(그 달에 그 날짜가 없으면 건너뜀), 매년은 같은 월·일 */
function occursOn(task, date) {
  if (date < task.date) return false;
  if (task.until && date > task.until) return false;
  const r = task.repeat, every = Math.max(1, r.every || 1);
  const a = parseYmd(task.date), b = parseYmd(date);
  switch (r.kind) {
    case 'none': return date === task.date;
    case 'interval': // 예전 저장 형식 (n일마다)
    case 'daily': return daysBetween(task.date, date) % (r.kind === 'interval' ? r.every : every) === 0;
    case 'weekly': return r.days.includes(weekday(date)) && Math.floor(daysBetween(weekStartOf(task.date), weekStartOf(date)) / 7) % every === 0;
    case 'monthly': return b.getDate() === a.getDate() && ((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth()) % every === 0;
    case 'yearly': return b.getDate() === a.getDate() && b.getMonth() === a.getMonth() && (b.getFullYear() - a.getFullYear()) % every === 0;
  }
  return false;
}
/* 회차의 시작·종료·마감 시각 (ms). 종일 일정은 시작일 0시 ~ 종료일 다음 날 0시 */
function occWindow(task, date) {

  if (task.type === 'jab' && task.deadline && task.deadline.enabled) {
    if (task.deadline.sameAsEnd) deadline = end;
    else deadline = at(addDays(date, daysBetween(task.date, task.deadline.date)), task.deadline.time);
  }
  return { start, end, deadline };
}

function durOf(task) {
  if (task.endDate && task.end) {
    const s = at(task.date, task.allDay ? '00:00' : task.start);
    const e = task.allDay ? at(addDays(task.endDate, 1), '00:00') : at(task.endDate, task.end);

    if (every === 1 && d.join() === '1,2,3,4,5') return '평일마다';

/* 옛 일정(날짜 + 시작 + 걸리는 시간)을 새 구조(시작·종료 일시)로 바꾼다. 이미 바뀐 일정은 그대로 */

/* 그 날짜에 걸쳐 있는 회차 (여러 날 일정은 둘째 날부터도 보인다). dayNo = 일정 며칠째 (1부터) */

/* 회차의 현재 상태: upcoming / late / running / urgent / break / breakOver / overPlan / overdue / missedStart / done / failed / past (일반 일정: todo / done) */

  if (run && run.status === 'done') return { ...base, kind: 'done' };
  if (run && run.status === 'failed') return { ...base, kind: 'failed' };
  const td = ymd(t);
  if (run && run.status === 'running') {

    if (run.brk && !run.brk.ended) return { ...base, kind: t < run.brk.until ? 'break' : 'breakOver' };
    if (w.deadline && w.deadline - t <= HEAT_POLICY.urgentWindow * MIN) return { ...base, kind: 'urgent' };

  overPlan: '예정 시간 지남', overdue: '마감 도달', missedStart: '마감 지남', done: '완료', failed: '실패', past: '지난 회차', todo: '할 일',

/* ---------- 잡도리 세기 계산 (FN04) — 0~100 숫자 하나. 이름은 scaleOf()가 붙인다 ---------- */
function heatOf(st, t = now()) {
  const P = HEAT_POLICY, task = st.task;
  const H0 = task.heat, room = 100 - H0, w = st.w, run = st.run;
  if (st.kind === 'done' || st.kind === 'failed') return { total: run.endHeat ?? H0, parts: [] };
  const parts = [{ label: '시작 ' + scaleOf().short, v: H0, base: true }];
  if (st.kind === 'upcoming' || st.kind === 'past') return { total: H0, parts };
  if (st.kind === 'overdue' || st.kind === 'missedStart') {
    parts.push({ label: '마감 시각 도달', v: 100 - H0 });
    return { total: 100, parts };
  }
  const winEnd = w.deadline ?? w.end;
  const span = Math.max(1, (winEnd - w.start) / MIN);
  const elapsed = Math.max(0, (t - w.start) / MIN);
  const p = Math.min(1, elapsed / span);
  if (p > 0) parts.push({ label: `시간 경과 ${Math.round(p * 100)}%`, v: room * P.progressShare * p });
  if (w.deadline) {
    const rem = (w.deadline - t) / MIN;
    if (rem <= P.urgentWindow && rem > 0) parts.push({ label: '마감 임박', v: room * P.urgentShare * (1 - rem / P.urgentWindow) + P.urgentBump });
  }
  if (st.kind === 'late') {
    const late = (t - w.start) / MIN;
    const v = Math.min(P.lateMax, late * P.latePerMin);
    if (v > 0) parts.push({ label: `시작 안 함 ${Math.round(late)}분`, v });
  }
  if (run && run.slack && run.slack.length) {

    for (const e of run.slack) {

      const bump = e.choice === 'study' ? 0 : e.choice === 'rest' ? P.slackRest : e.choice === 'focus' ? P.slackFocus : P.slackBump;
      if (since >= 0 && since < P.slackDecay) s += bump * (1 - since / P.slackDecay);
    }
    if (s > 0.5) parts.push({ label: `딴짓 ${run.slack.length}회`, v: s });
  }
  if (st.kind === 'breakOver') {
    const over = (t - run.brk.until) / MIN;

/* ---------- 캐릭터 반응 고르기: 일정 상태 → 표정·자세·동작·부풂 (모든 캐릭터 공통 약속) ---------- */
// ctx: { lateMin, elapsedMin, penalty, streak, early, bucket }
function mascotFor(kind, stage, ctx = {}) {

  const F = (v) => clamp(v + pen, 0, 1);

  switch (kind) {

    case 'break': return { expr: 'sleepy', pose: 'curl', motion: 'sleep', fluff: 0 };
    case 'breakOver': return { expr: 'suspicious', pose: 'nag', motion: 'nag', fluff: F(0.2) };

    case 'late':
      if ((ctx.lateMin ?? 99) < 3) return { expr: 'focus', pose: 'nag', motion: 'nag', fluff: F(0) };

/* 강도 단계별 예시 반응 (온보딩·등록 화면) */
function mascotForStage(sg) {

    { expr: 'suspicious', pose: 'idle', motion: 'look', fluff: 0.1 },

/* ---------- 페르소나 말 만들기 ---------- */
function leftText(st, t = now()) {
  if (st.w.deadline) {
    const r = (st.w.deadline - t) / MIN;
    return r > 0 ? `마감까지 ${fmtDur(r)}` : '마감 지남';
  }
  const r = (st.w.end - t) / MIN;
  return r > 0 ? `예정 종료까지 ${fmtDur(r)}` : '예정 시간 지남';

function lineFor(st, heat, t = now()) {

  const bucket = Math.floor(elapsedMin / 10);

    title, app: '',

    breakLeft: run && run.brk ? fmtDur(Math.max(0, (run.brk.until - t) / MIN)) : '',

  const k = st.key;
  switch (st.kind) {
    case 'upcoming': pick = pickLine(k + ':up', L.upcoming, 0); fact = `${title} · ${v.startIn} 뒤 시작`; break;
    case 'late': {
      const lateMin = (t - st.w.start) / MIN;
      pick = lateMin < 3 ? pickLine(k + ':due', L.due, 0) : pickLine(k + ':late' + stage, L.late[stage], bucket);
      fact = lateMin < 3 ? `${title} · 지금 시작` : `${title} · ${v.late} 지남${st.w.deadline ? ' · ' + v.left : ''}`;

      break;

    case 'break': pick = pickLine(k + ':brk', L.break, 0); fact = `휴식 ${v.breakLeft} 남음`; break;
    case 'breakOver': pick = pickLine(k + ':brko', L.breakOver, 0); fact = `휴식 ${v.over} 넘김`; break;
    case 'overPlan': pick = pickLine(k + ':over', L.overPlan, 0); fact = `${title} · 예정 종료 지남`; break;
    case 'overdue': pick = pickLine(k + ':od', L.overdue, 0); fact = `${title} · 마감 시각`; break;
    case 'missedStart': pick = pickLine(k + ':ms', L.missedStart, 0); fact = `${title} · 시작 못 하고 마감 지남`; break;
    case 'done': pick = { tpl: run.line || L.doneNone[0], id: k + ':done' }; break;
    case 'failed': pick = { tpl: run.line || L.failed[0], id: k + ':fail' }; break;

  }

  return { id: pick.id, text: fillLine(pick.tpl, v), fact };
}

/* ---------- 실행 기록 조작 ---------- */
/* 로그는 숫자를 따로 저장해 두고(data), 보여 줄 때 지금 눈금 이름으로 문장을 만든다 (logText) */
function logRun(run, kind, text, data) { run.log.push({ at: now(), kind, text, ...(data || {}) }); }
function logText(e) {
  if (e.kind === 'heat' && e.h != null) return `${lvs(e.h)} — ${stageOf(e.h).name} 단계로 올라감`;
  if (e.kind === 'floor' && e.a != null) return `${scaleOf().floor} ${lv(e.a)} → ${lv(e.b)}`;
  return e.text;
}
function startOcc(m, st) {
  const run = m.runs[st.key] = m.runs[st.key] || {};
  Object.assign(run, {
    status: 'running', startedAt: now(), slack: [], log: [], peak: 0, lastStage: 0,
    title: st.task.title, startHeat: st.task.heat, plan: { start: st.w.start, end: st.w.end, deadline: st.w.deadline },
  });
  const late = Math.round((now() - st.w.start) / MIN);
  logRun(run, 'start', late > 0 ? `${late}분 늦게 시작` : late < 0 ? `${-late}분 일찍 시작` : '제시간에 시작');

}
function trackHeat(m) {
  // 진행 중 회차의 최고값과 단계 변화를 기록 (시간이 흐를 때마다 호출)
  for (const [k, r] of Object.entries(m.runs)) {
    if (r.status !== 'running') continue;
    const [tid, d] = splitKey(k);
    const t = findTask(m, tid); if (!t) continue;
    const st = occState(m, t, d);
    const h = heatOf(st).total;
    r.peak = Math.max(r.peak || 0, h);
    const sg = stageOf(h).id;
    if (sg > (r.lastStage || 0)) {
      if (r.lastStage) logRun(r, 'heat', `${h} — ${sg}단계로 올라감`, { h });
      r.lastStage = sg;
    }

      startedAt: null, slack: [], log: [], peak: 0, title: st.task.title, startHeat: st.task.heat,
      plan: { start: st.w.start, end: st.w.end, deadline: st.w.deadline },
    });
  }
  const h = heatOf(st, t).total;
  run.endHeat = h;
  run.peak = Math.max(run.peak || 0, h);
  run.endedAt = t;
  run.floorBefore = floorOf(m);
  run.penaltyBefore = m.penalty;
  run.streakBefore = m.streak;
  const L = persona().lines;
  if (success) {
    run.status = 'done';
    m.streak += 1;
    run.cooled = false;
    if (m.streak >= HEAT_POLICY.coolStreak && m.penalty > 0) { m.penalty -= 1; m.streak = 0; run.cooled = true; }
    let pool = L.doneNone;
    if (st.w.deadline) pool = (st.w.deadline - t) / MIN >= 20 ? L.doneEarly : L.doneClose;
    if (m.streak >= 2 && !(m.streak >= HEAT_POLICY.coolStreak && m.penalty > 0)) pool = L.doneProud;

    logRun(run, 'done', '완료');

    m.penalty = Math.min(maxPenalty(m), m.penalty + 1);
    m.streak = 0;
    run.excuse = extra.excuse || null;
    run.reason = extra.reason || null;
    run.line = pickLine(st.key + ':result', L.failed, 1).tpl;

  if (r.status === 'done' || r.status === 'failed') { m.penalty = r.penaltyBefore ?? m.penalty; m.streak = r.streakBefore ?? m.streak; }
  delete m.runs[key];

/* 날이 바뀌면, 결과 없이 지나간 잡도리 회차를 실패로 정리 (정책 예시) */
function settleDays(m) {
  const td = today();
  if (!m) return [];
  const settled = [];
  const from = state.settledDay && state.settledDay < td ? state.settledDay : null;
  if (!from) { state.settledDay = td; return settled; }
  const startD = daysBetween(from, td) > 14 ? addDays(td, -14) : from;
  for (let d = startD; d < td; d = addDays(d, 1)) {
    for (const task of m.tasks) {
      if (task.type !== 'jab' || !occursOn(task, d)) continue;
      if (at(d, '23:59') < task.createdAt) continue;
      const st = occState(m, task, d, at(d, '23:59'));
      if (st.kind === 'done' || st.kind === 'failed' || st.kind === 'upcoming') continue;
      const keep = state.clock;
      state.clock = at(d, '23:59');
      finishOcc(m, occState(m, task, d), false, { reason: '결과 없이 날이 바뀜' });
      state.clock = keep;
      settled.push(task.title);
    }
  }
  state.settledDay = td;
  return settled;
}

/* =========================================================

/* ---------- 몸 실루엣 (디자인 시트 기본형 기준) ----------
   옆으로 넓고 바닥이 납작한 솜뭉치. 둘레에 작은 혹이 촘촘하고, 크기가 조금씩 달라 손으로 그린 느낌.
   단계(부풂)가 올라가도 모양은 그대로 — 아주 살짝 커지고(최대 6%) 주변 먼지 입자와 떨림만 늘어난다 */
const MR_WEIGHTS = [1.0, 0.86, 1.08, 0.92, 1.04, 0.88, 1.1, 0.95, 1.0, 0.9, 1.06, 0.93, 1.02, 0.89, 1.07, 0.96, 0.98, 0.91];
function mrBodyPath() {
  const cx = 120, cy = 134, rx = 84, ryTop = 76, ryBot = 54;
  const n = 18;
  const total = MR_WEIGHTS.reduce((x, y) => x + y, 0);
  const pt = (t) => { const s = Math.sin(t); return [cx + rx * Math.cos(t), cy + (s > 0 ? ryBot : ryTop) * s]; };
  let t = -Math.PI / 2 - 0.1, [x0, y0] = pt(t);
  let d = `M${x0.toFixed(1)} ${y0.toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const t1 = t + (MR_WEIGHTS[i] / total) * Math.PI * 2;
    const [x1, y1] = pt(t1);
    const chord = Math.hypot(x1 - x0, y1 - y0);
    const bottom = Math.sin((t + t1) / 2) > 0.62; // 바닥은 거의 평평하게 (앉아 있는 느낌)
    const r = chord * (bottom ? 1.9 : 0.6);
    d += ` A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    t = t1; x0 = x1; y0 = y1;
  }
  return d + ' Z';
}
const MR_BODY = mrBodyPath();

/* 부풂(단계)에 따라 주변에 떠다니는 먼지 입자 — 모양 대신 입자 수로 단계를 보여 준다 */
function mrDust(fl) {
  if (fl < 0.15) return '';
  const pts = [[34, 118, 3], [208, 110, 2.6], [46, 72, 2.2], [196, 64, 3], [26, 160, 2], [216, 160, 2.4], [70, 50, 1.8], [172, 44, 2]];
  const k = Math.round(2 + fl * 6);
  return `<g class="mr-dust">${pts.slice(0, k).map(([x, y, r], i) => `<circle cx="${x}" cy="${y}" r="${r}" class="d${i % 3}"/>`).join('')}</g>`;
}

  <path class="tick t1" d="M160 155 l3.5 3.5 l6 -7"/><path class="ln" d="M173 155 h14"/><path class="tick t2" d="M160 166 l3.5 3.5 l6 -7"/><path class="ln" d="M173 166 h14"/><path class="tick t3" d="M160 177 l3.5 3.5 l6 -7"/><path class="ln" d="M173 177 h10"/></g>`;
