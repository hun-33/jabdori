const COSTUMES = { basic: { name: '기본형', tagline: '가장 기본적인 모습', tuft: true } };

/**
 * 미루먼지 그리기 (디자인 시트 기본형)
 *  expr   표정: default|happy|focus|suspicious|angry|furious|disappointed|sad|surprised|flustered|shy|sleepy|tired|proud
 *  pose   자세: idle|wave|cheer|nag|check|cry|curl|puff|flag|chase
 *  motion 동작: breathe|bounce|look|puff|cry|jump|sleep|chase|check|nag|none
 *  fluff  0~1 단계(몽글→빵빵). 모양은 그대로, 살짝 커지고 먼지 입자·떨림이 늘어난다
 */
let MR_SEQ = 0; // 그라데이션 id가 화면 안에서 겹치지 않게
function mireumSVG({ expr = 'default', pose = 'idle', motion = 'breathe', fluff = 0, label, shadow = true } = {}) {
  const f = MR_FACES[expr] || MR_FACES.default;
  const fl = clamp(fluff, 0, 1);
  const scale = 1 + fl * 0.06;
  const extras = (f.extra || '').split(' ').filter(Boolean).map((k) => MR_EXTRAS[k]).join('');
  const aria = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
  const squash = pose === 'cry' || pose === 'curl' ? 'squash' : '';
  const gid = 'mrg' + (++MR_SEQ);
  return `<svg class="mireum e-${expr} p-${pose} m-${motion} ${fl > 0.55 ? 'bristle' : ''}" viewBox="0 0 240 240" ${aria} focusable="false">
    <defs><radialGradient id="${gid}" cx="48%" cy="42%" r="62%"><stop offset="0" stop-color="#FFFAF1"/><stop offset=".72" stop-color="#FFF4E4"/><stop offset="1" stop-color="#F3E1D0"/></radialGradient></defs>
    ${shadow ? '<ellipse class="mr-shadow" cx="120" cy="194" rx="72" ry="8"/>' : ''}
    <g class="mr-all">
      <g class="mr-scale ${squash}" style="transform:scale(${scale.toFixed(3)})">
        ${MR_FEET}${MR_TUFT}
        <path class="mr-body" d="${MR_BODY}" style="fill:url(#${gid})"/>
        <path class="mr-sketch" d="${MR_BODY}" transform="translate(0.8 0.6)"/>
        <g class="mr-face">
          <ellipse class="mr-cheek" cx="83" cy="152" rx="10.5" ry="6.5"/><ellipse class="mr-cheek" cx="157" cy="152" rx="10.5" ry="6.5"/>
          ${f.brows ? `<g class="mr-brows">${f.brows}</g>` : ''}${f.eyes}<g class="mr-mouth">${f.mouth}</g>
        </g>
        <g class="mr-pose">${(MR_POSES[pose] || MR_POSES.idle)()}</g>
      </g>
      ${mrDust(fl)}${extras}
    </g>
  </svg>`;
}

/* 실시간으로 바뀌는 값(시간·잡도리 세기)은 화면 전체를 다시 그리지 않고 이 값만 바꾼다 */
let LIVE = {}, LIVES = {};
function L(k, v, cls = '') { LIVE[k] = String(v); return `<span data-live="${k}"${cls ? ` class="${cls}"` : ''}>${esc(v)}</span>`; }
function LS(k, prop, val) { LIVES[k] = { prop, val: String(val) }; return `data-ls="${k}" style="${prop}:${val}"`; }
function sigOf(html) {
  return html
    .replace(/(<span data-live="[^"]*"[^>]*>)[^<]*(<\/span>)/g, '$1$2')
    .replace(/data-ls="([^"]*)" style="[^"]*"/g, 'data-ls="$1"');
}

function heatVar(stage) { return `var(--heat-${stage})`; }
/* 큰 숫자 (단위가 있는 눈금이면 작은 단위 글자를 붙인다) */
function degHTML(h, liveKey, cls = '') {
  const u = scaleOf().unit;
  return `<span class="deg ${cls}">${liveKey ? L(liveKey, h) : esc(h)}${u ? `<span class="deg-u">${esc(u)}</span>` : ''}</span>`;
}
function stageChip(h, dark) {
  const s = stageOf(h);
  return `<span class="stage-chip ${dark ? 'on-dark' : ''}" style="--hc:${heatVar(s.id)}"><i aria-hidden="true"></i>${s.name}</span>`;
}

/* ---------- 공통 조각 ---------- */
function rowMark(st) {
  const k = st.kind;
  if (st.task.type === 'normal') return '';
  const s = stageOf(st.task.heat).id;
  let ic = scaleOf().icon, cls = 'mk-heat';
  if (k === 'done') { ic = 'check'; cls = 'mk-ok'; }
  else if (k === 'failed') { ic = 'x'; cls = 'mk-bad'; }
  else if (ACTIVE_KINDS.includes(k)) { ic = 'dot'; cls = 'mk-live'; }
  else if (k === 'late' || k === 'missedStart') { ic = 'alert'; cls = 'mk-late'; }
  else if (k === 'past') { ic = 'clock'; cls = 'mk-past'; }
  return `<span class="row-mark ${cls}" style="--hc:${heatVar(s)}">${icon(ic)}</span>`;
}
function rowSide(st, t = now()) {
  const k = st.kind;
  if (k === 'upcoming' && st.date === today()) return `${fmtDur((st.w.start - t) / MIN)} 뒤`;
  if (k === 'late') return (t - st.w.start) / MIN < 1 ? '지금 시작' : `${fmtDur((t - st.w.start) / MIN)} 늦음`;
  if (k === 'running' || k === 'urgent' || k === 'overPlan') return KIND_LABEL[k] + ' · ' + stageOf(heatOf(st, t).total).name;
  return KIND_LABEL[k] || '';
}
function timeRange(task) {
  if (task.allDay) return spanDays(task) ? `종일 · ${spanDays(task) + 1}일` : '종일';
  const sd = spanDays(task);
  const end = task.end || minToHm(hmToMin(task.start) + durOf(task));
  return sd ? `${task.start} – ${fmtMD(task.endDate)} ${end}` : `${task.start}–${end}`;
}
/* 여러 날 일정의 둘째 날부터는 '2/3일째'처럼 보여 준다 */
function occTimeText(st) {
  const t = st.task;
  if (st.dayNo > 1) return `${st.dayNo}/${st.days}일째${t.allDay ? '' : ` · ${st.dayNo === st.days ? '~' + t.end : '종일'}`}`;
  return timeRange(t);
}
/* 일정 색 (일정마다 고른 색 · 없으면 종류별 기본색) */
function taskColor(t) { return t.color || (t.type === 'jab' ? 'coral' : 'sky'); }
function rowOcc(st) {
  const task = st.task;

function pickTicket(m) {
  const td = today();
  const jabs = occurrencesOn(m, td).filter((o) => o.task.type === 'jab');
  let tk = jabs.find((o) => ACTIVE_KINDS.includes(o.kind))
    || jabs.find((o) => o.kind === 'late' || o.kind === 'missedStart')
    || jabs.filter((o) => o.kind === 'upcoming').sort((a, b) => a.w.start - b.w.start)[0];
  let next = null;
  if (!tk) {
    for (let i = 1; i <= 14 && !next; i++) {
      const d = addDays(td, i);
      next = occurrencesOn(m, d).find((o) => o.task.type === 'jab') || null;
    }
  }
  return { tk, next, jabs };
}
function personaForToday(m) {
  const t = now();
  const { tk, next, jabs } = pickTicket(m);
  const ctx = { penalty: m.penalty, streak: m.streak };
  let res;
  if (tk) {
    const h = heatOf(tk, t).total, sg = stageOf(h).id;
    const ln = lineFor(tk, h, t);
    const elapsedMin = tk.run && tk.run.startedAt ? (t - tk.run.startedAt) / MIN : 0;
    ctx.lateMin = (t - tk.w.start) / MIN; ctx.elapsedMin = elapsedMin; ctx.bucket = Math.floor(Math.max(0, (t - tk.w.start) / MIN) / 10);
    res = { tk, next, heat: h, stage: sg, mc: mascotFor(tk.kind, sg, ctx), line: ln };
  } else {
    const L = persona().lines, f = floorOf(m);
    let pk, mc;
    if (!m.tasks.length) { pk = pickLine('empty', L.empty); mc = { expr: 'default', pose: 'idle', motion: 'look', fluff: 0 }; }
    else if (jabs.length && jabs.every((o) => o.kind === 'done' || o.kind === 'failed')) {
      if (jabs.some((o) => o.kind === 'failed')) { pk = pickLine('dayFail', L.dayFail); mc = mascotFor('failed', 1, ctx); }
      else { pk = pickLine('allDone', L.allDone); mc = { expr: 'proud', pose: 'flag', motion: 'breathe', fluff: 0 }; }
    } else { pk = pickLine('noneToday', L.noneToday); mc = { expr: 'sleepy', pose: 'curl', motion: 'sleep', fluff: 0 }; }
    if (m.penalty >= 2 && mc.expr !== 'proud') mc.fluff = Math.max(mc.fluff, (m.penalty - 1) * 0.25); // 반복 실패: 부풀어 있음
    res = { tk: null, next, heat: f, stage: stageOf(f).id, mc, line: { id: pk.id, text: pk.tpl }, idle: true };
  }
  // 방금 일정을 올렸거나 캐릭터를 눌렀을 때의 짧은 반응
  if (ui.react && ui.react.until > Date.now()) {
    res.mc = { ...res.mc, ...ui.react.mc };
    if (ui.react.line) res.line = { id: 'react:' + ui.react.id, text: ui.react.line, fact: ui.react.fact || '' };
  }
  return res;
}

/* ---------- 달력 (일·주·월) ----------
   ui.calMode: 'day' | 'week' | 'month'  ·  ui.selDate: 고른 날짜(세 보기가 같이 씀)  ·  ui.calMonth: 월간에 보이는 달

/* 월간 막대: 한 주(일~토) 안에서 일정마다 '줄(lane)'을 하나씩 잡아 칸을 가로질러 이어 그린다.
   여러 날 일정은 주가 바뀌면 다음 주 줄에서 다시 시작하고, 주마다 제목을 가운데에 다시 적는다 (갤럭시 캘린더 방식). */
const MO_LANES = 3; // 한 주에 보이는 줄 수 (넘치면 날짜마다 +N)
function weekBars(m, ws) {
  const we = addDays(ws, 6), seen = new Map();
  for (let i = 0; i < 7; i++) for (const o of occurrencesCovering(m, addDays(ws, i))) if (!seen.has(o.key)) seen.set(o.key, o);
  const segs = [...seen.values()].map((o) => {
    const last = addDays(o.date, o.days - 1);
    const s = o.date < ws ? ws : o.date, e = last > we ? we : last;
    return { o, col: daysBetween(ws, s), span: daysBetween(s, e) + 1, contL: o.date < ws, contR: last > we, multi: o.days > 1 };
  });
  // 먼저 시작하는 것 → 여러 날 일정 → 긴 것 → 종일 → 이른 시각 순으로 줄을 잡는다
  segs.sort((a, b) => a.col - b.col || b.multi - a.multi || b.span - a.span || b.o.task.allDay - a.o.task.allDay || a.o.w.start - b.o.w.start);
  const lanes = [];
  for (const g of segs) {

    if (li < 0) { li = lanes.length; lanes.push(Array(7).fill(false)); }
    for (let c = g.col; c < g.col + g.span; c++) lanes[li][c] = true;

/* ---------- 기록 ---------- */
function allRecords(m) {
  return Object.entries(m.runs).filter(([, r]) => (r.status === 'done' || r.status === 'failed') && r.startHeat != null) // 잡도리 일정 기록만
    .map(([k, r]) => ({ key: k, run: r, date: splitKey(k)[1] }))
    .sort((a, b) => (b.run.endedAt || 0) - (a.run.endedAt || 0));
}
function viewRecords(m) {
  const recs = allRecords(m);
  const ok = recs.filter((r) => r.run.status === 'done').length, bad = recs.length - ok;
  const f = floorOf(m);
  const changes = recs.filter((r) => r.run.floorAfter !== r.run.floorBefore).slice(0, 4);
  let list = '';
  if (!recs.length) {
    list = `<div class="empty-block">${mascot(m, { expr: 'sleepy', pose: 'curl', motion: 'sleep', label: `${persona().name}, 졸림` })}<p class="eb-title">아직 남은 기록이 없어요</p><p class="eb-body">잡도리 일정을 끝내거나 놓치면 여기에 도장과 함께 남아요.</p><button class="btn secondary" data-act="tab" data-tab="today">오늘 일정 보기</button></div>`;
  } else {
    let lastDate = '';
    list = '<ul class="rec-list">';
    for (const r of recs) {
      if (r.date !== lastDate) { list += `<li class="rec-date">${fmtDateLong(r.date)}</li>`; lastDate = r.date; }
      const done = r.run.status === 'done';
      list += `<li><button class="rec-row" data-act="openRecord" data-key="${r.key}">
        <span class="rec-stamp ${done ? 'ok' : 'bad'}">${icon(done ? 'check' : 'x')}<span class="sr">${done ? '완료' : '실패'}</span></span>
        <span class="row-main"><span class="row-title">${esc(r.run.title)}</span><span class="row-meta">${done ? '완료' : '실패'} · ${r.run.endedAt ? fmtHM(r.run.endedAt) : ''} · 최고 ${lvs(r.run.peak || r.run.endHeat)}${r.run.slack && r.run.slack.length ? ` · 딴짓 ${r.run.slack.length}회` : ''}${r.run.excuse ? ' · 핑계: ' + EXCUSES[r.run.excuse] : ''}</span></span>
        ${icon('chevron', 'muted')}</button></li>`;
    }
    list += '</ul>';
  }
  const pct = (x) => `${x}%`;
  const S = scaleOf(m);
  const html = `<section class="scr records" aria-labelledby="rec-h">
    <header class="hdr"><div><h1 id="rec-h" class="hdr-title">기록</h1><p class="hdr-sub">끝낸 일도, 놓친 일도 남겨 둬요</p></div></header>
    <div class="paper">

          <dl class="fp-stats"><div><dt>완료</dt><dd>${ok}</dd></div><div><dt>실패</dt><dd>${bad}</dd></div><div><dt>연속 성공</dt><dd>${m.streak}/${HEAT_POLICY.coolStreak}</dd></div></dl></div>
        <div class="thermo" role="img" aria-label="${S.floor} ${lv(f)}, 처음 ${lv(m.initialHeat)}">
          <div class="thermo-track">${S.stages.map((s, i, a) => `<i style="--hc:${heatVar(s.id)};left:${s.min}%;width:${(a[i + 1] ? a[i + 1].min : 100) - s.min}%"></i>`).join('')}</div>
          <span class="thermo-floor" style="left:${pct(f)}">${icon('lock')}</span>

        </div>
        <p class="fp-note">${m.penalty ? `지금 ${extraText(m.penalty, m)}. 잡도리 일정을 ${HEAT_POLICY.coolStreak - m.streak}번 더 연속으로 끝내면 ${josa(S.clear, '으로/로')} 한 ${S.extraUnit} 내려가요.` : `실패 가산이 없어요. 놓치면 다음에 올리는 잡도리 일정부터 ${HEAT_POLICY.failStep}씩 올라가요.`}</p>
        ${changes.length ? `<ul class="fp-changes">${changes.map((c) => `<li>${fmtMD(c.date)} ${esc(c.run.title)} ${c.run.status === 'failed' ? '실패' : S.clear} · ${lv(c.run.floorBefore)} → <b>${lv(c.run.floorAfter)}</b></li>`).join('')}</ul>` : ''}

  return { id: 'records', html };
}

function viewTaskSheet(m, key) {
  const [tid, d] = splitKey(key);
  const task = findTask(m, tid);
  if (!task) return '';
  const st = occState(m, task, d);
  const jab = task.type === 'jab';
  const h = jab ? heatOf(st).total : null;
  const run = st.run;
  const facts = [
    ['날짜', spanDays(task) ? `${fmtDateShort(d)} – ${fmtDateShort(addDays(d, spanDays(task)))}` : fmtDateLong(d)],
    ['시간', task.allDay ? '종일' : `${timeRange(task)} (${fmtDur(durOf(task))})`],
    ['반복', repeatText(task)],
    ...(task.memo ? [['메모', esc(task.memo)]] : []),
  ];
  if (jab) {
    facts.push(['마감', st.w.deadline ? `${fmtDateShort(ymd(st.w.deadline))} ${fmtHM(st.w.deadline)}` : '마감 없음']);
    facts.push(['시작 ' + scaleOf().short, `${lv(task.heat)} · ${stageOf(task.heat).name}`]);
  }
  let primary = '';
  const td = today();
  if (jab) {
    if (st.kind === 'done' || st.kind === 'failed') primary = `<button class="btn primary block" data-act="openRecord" data-key="${key}">결과 다시 보기</button>`;
    else if (ACTIVE_KINDS.includes(st.kind) || st.kind === 'missedStart') primary = `<button class="btn primary block" data-act="openFocus" data-key="${key}">${st.kind === 'missedStart' || st.kind === 'overdue' ? '결과 입력하기' : '집중 모드로 보기'}</button>`;
    else if (d === td) primary = `<button class="btn primary block" data-act="startOcc" data-key="${key}">${icon('play')}${st.kind === 'upcoming' ? '미리 시작하기' : '시작하기'}</button>`;
    else if (d > td) primary = `<p class="hint center">${fmtDateShort(d)} 당일에 시작할 수 있어요.</p>`;
    else primary = `<p class="hint center">지난 회차예요. 기록이 없으면 날이 바뀔 때 실패로 정리돼요.</p>`;
  } else {

/* ---------- 일정 입력 초안 ----------

const COLORS = [['coral', '산호'], ['sun', '노랑'], ['mint', '민트'], ['sky', '하늘'], ['lilac', '라일락'], ['stone', '회색']];

function newDraft(m, date, type = 'jab', range) {

}
function draftFromTask(m, t) {

  const dl = t.deadline && t.deadline.enabled ? (t.deadline.sameAsEnd ? 'end' : 'custom') : 'off';
  return {

    repeatKind: kind, days: t.repeat.days ? [...t.repeat.days] : [weekday(t.date)], every: t.repeat.every || 1,

    dlMode: dl, dlDate: t.deadline ? t.deadline.date : t.date, dlTime: t.deadline ? t.deadline.time : '20:00',
    alarms: [...(t.alarms || [])], color: t.color || (t.type === 'jab' ? 'coral' : 'sky'), memo: t.memo || '',

}
/* 초안의 시작·종료 시각(ms)과 걸리는 시간(분) */
function draftStartMs(f) { return at(f.date, f.allDay ? '00:00' : f.start); }
function draftEndMs(f) { return f.allDay ? at(addDays(f.endDate, 1), '00:00') : at(f.endDate, f.end); }
function draftDuration(f) { return Math.round((draftEndMs(f) - draftStartMs(f)) / MIN); }
function draftSummary(f) {
  const days = daysBetween(f.date, f.endDate) + 1;
  if (f.allDay) return days > 1 ? `종일 · ${days}일 동안` : '종일';
  const d = draftDuration(f);

  return days > 1 ? `${fmtDur(d)} · ${days}일에 걸친 일정` : fmtDur(d);

function draftDeadlineMs(f) { return f.dlMode === 'end' ? draftEndMs(f) : f.dlMode === 'custom' ? at(f.dlDate, f.dlTime) : null; }

/* ---------- 스크롤 휠 선택기 (기획안 v5: 스크롤 방식으로 시간 선택) ---------- */

  calPick: (t) => {

  slotTap: (t) => {

      body: `‘${esc(task.title)}’${task.repeat.kind !== 'none' ? '의 앞으로 모든 회차가' : jo(task.title, '이/가')} 사라져요. 끝냈거나 놓친 기록은 기록 탭에 남아요.`,

  formType: (t) => {
    const f = ui.form; f.type = t.dataset.v;
    if (f.type === 'jab') { f.heat = Math.max(f.heat, f.minHeat); f.allDay = false; } // 잡도리는 시작 시각이 있어야 한다
    f._autoNormal = false;

    rerenderForm();
  },
  formRepeat: (t) => {
    const f = ui.form; f.repeatKind = t.dataset.v === 'interval' ? 'daily' : t.dataset.v; // 'interval'은 예전 이름
    if (f.repeatKind === 'weekly' && !f.days.length) f.days = [weekday(f.date)];

  },
  formDay: (t) => { const f = ui.form, d = Number(t.dataset.d); f.days = f.days.includes(d) ? f.days.filter((x) => x !== d) : [...f.days, d]; if (f.days.length) delete f.errors.days; rerenderForm(); },
  formEvery: (t) => { const f = ui.form; f.every = clamp(f.every + Number(t.dataset.delta), 1, 30); rerenderForm(); },
  /* 걸리는 시간 버튼: 종료 = 시작 + n분 (날짜를 넘기면 종료 날짜도 넘어간다) */
  formDur: (t) => {
    const f = ui.form, v = t.dataset.v;
    if (v === 'custom') { f.pick = 'end'; rerenderForm(); return; }
    const e = draftStartMs(f) + Number(v) * MIN;
    f.endDate = ymd(e); f.end = fmtHM(e); f.allDay = false;
    delete f.errors.time; rerenderForm();
  },
  formDl: (t) => {
    const f = ui.form; const v = t.dataset.v === 'on' ? 'custom' : t.dataset.v; // 'on'은 예전 이름
    f.dlMode = v;

      f.pick = 'dl';

  },
  formPick: (t) => {

    rerenderForm();
  },
  /* 폼 안 달력에서 날짜 누르기: 시작 쪽이면 시작 날짜(기간은 유지) 후 끝 쪽으로 넘어가고, 끝 쪽이면 종료 날짜 */
  formCalPick: (t) => {
    const f = ui.form, d = t.dataset.date;
    if (f.pick === 'start') {
      const span = Math.max(0, daysBetween(f.date, f.endDate));
      f.date = d; f.endDate = addDays(d, span);
      if (f.repeatKind === 'weekly' && f.days.length === 1) f.days = [weekday(d)];
      if (!f._dlTouched || f.dlDate < f.date) f.dlDate = f.date;
      f.pick = 'end';
    } else if (d < f.date) { f.date = d; f.endDate = d; } // 시작보다 앞을 누르면 그날 하루 일정으로
    else f.endDate = d;
    if (!f.allDay && f.endDate === f.date && hmToMin(f.end) <= hmToMin(f.start)) { // 같은 날인데 종료가 앞서면 시작 + 1시간
      const e = draftStartMs(f) + 60 * MIN; f.endDate = ymd(e); f.end = fmtHM(e);
    }

    delete f.errors.date; delete f.errors.time; rerenderForm();
  },
  formCalNav: (t) => {
    const f = ui.form; const [y, mo] = (f.calMonth || f.date.slice(0, 7)).split('-').map(Number);
    const d = new Date(y, mo - 1 + Number(t.dataset.delta), 1); f.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; rerenderForm();

     새 일정은 '일반 일정'으로, 고치는 일정은 '잡도리 끔'으로 바꾸고 화면에 그 사실을 적는다. 끄면 원래대로 돌려 놓는다. */
  formAllDay: () => {
    const f = ui.form;
    f.allDay = !f.allDay;
    if (f.allDay && f.type === 'jab') {
      if (!f.id) { f.type = 'normal'; f._autoNormal = true; if (!f._colorTouched) f.color = 'sky'; }
      else if (f.jabOn !== false) { f.jabOn = false; f._autoJabOff = true; }
    } else if (!f.allDay) {
      if (f._autoNormal) { f.type = 'jab'; f.heat = Math.max(f.heat, f.minHeat); if (!f._colorTouched) f.color = 'coral'; }
      if (f._autoJabOff) f.jabOn = true;
      f._autoNormal = f._autoJabOff = false;
    }
    if (f.endDate < f.date) f.endDate = f.date;
    delete f.errors.time; rerenderForm();
  },
  formMore: () => { const f = ui.form; f.more = !f.more; rerenderForm(); },
  formAlarm: (t) => { const f = ui.form, v = Number(t.dataset.v); f.alarms = f.alarms.includes(v) ? f.alarms.filter((x) => x !== v) : [...f.alarms, v]; rerenderForm(); },
  formColor: (t) => { const f = ui.form; f.color = t.dataset.v; f._colorTouched = true; rerenderForm(); },
  formJabOn: () => { const f = ui.form; f.jabOn = !f.jabOn; f._autoJabOff = false; if (f.jabOn && f.allDay) { f.allDay = false; toast('잡도리는 시작 시각이 있어야 해서 종일을 껐어요.'); } rerenderForm(); },

      return;

/* =========================================================
   04b-input: 스크롤 선택기 '직접 입력'
   - 선택기 가운데(선택된 줄)를 누르거나 '직접 입력'을 누르면 입력창이 뜬다
   - 여러 형식을 받아들이고(18:30, 1830, 오후 6시 반, 12/3, 내일 …) 범위·순서를 모두 검사한다
   ========================================================= */

/* ---------- 문자열 → 값 (순수 함수: 테스트하기 쉽게 화면과 분리) ---------- */
// 전각 숫자·기호를 보통 문자로, 공백 정리
function normInput(raw) {
  return String(raw || '')
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[：﹕]/g, ':').replace(/[．。]/g, '.').replace(/[／]/g, '/').replace(/[－‐–—]/g, '-')
    .trim().toLowerCase();
}

// 시각: 18:30 · 1830 · 930 · 18시 30분 · 6시 반 · 오후 6:30 · 6:30pm · 정오 · 자정
function parseTimeInput(raw) {
  let s = normInput(raw).replace(/\s+/g, '');
  if (!s) return { ok: false, error: '시각을 입력해 주세요.' };
  if (/^(정오|낮12시)$/.test(s)) return { ok: true, hm: '12:00' };
  if (/^(자정|밤12시)$/.test(s)) return { ok: true, hm: '00:00' };
  let mer = null; // 'am' | 'pm'
  if (/(오후|pm|p\.m\.|저녁|밤)/.test(s)) mer = 'pm';
  if (/(오전|am|a\.m\.|새벽|아침)/.test(s)) mer = mer ? 'both' : 'am';
  if (mer === 'both') return { ok: false, error: '오전·오후 중 하나만 적어 주세요.' };
  s = s.replace(/(오후|오전|pm|am|p\.m\.|a\.m\.|저녁|밤|새벽|아침)/g, '');
  s = s.replace(/시반$/, '시30분').replace(/반$/, '30');
  let h, m;
  let mt;
  if ((mt = s.match(/^(\d{1,2})(?:[:.h]|시)(\d{1,2})?(?:분)?$/))) { h = +mt[1]; m = mt[2] != null ? +mt[2] : 0; }
  else if ((mt = s.match(/^(\d{1,2})시?$/))) { h = +mt[1]; m = 0; }
  else if ((mt = s.match(/^(\d{1,2})(\d{2})$/))) { h = +mt[1]; m = +mt[2]; }
  else return { ok: false, error: '시각 형식을 알아보지 못했어요. 예) 18:30, 1830, 오후 6시 30분' };
  if (m > 59) return { ok: false, error: '분은 0~59 사이로 적어 주세요.' };
  if (mer) {
    if (h < 1 || h > 12) return { ok: false, error: `${mer === 'pm' ? '오후' : '오전'}는 1~12시로 적어 주세요.` };
    if (mer === 'pm' && h !== 12) h += 12;
    if (mer === 'am' && h === 12) h = 0;
  }
  if (h === 24 && m === 0) return { ok: false, error: '24시는 0시(00:00)로 적어 주세요. 하루를 넘기는 마감은 날짜를 다음 날로 바꿔 주세요.' };
  if (h > 23) return { ok: false, error: '시는 0~23 사이로 적어 주세요.' };
  return { ok: true, hm: `${pad(h)}:${pad(m)}` };
}

// 걸리는 시간: 90분 · 1시간 30분 · 1시간 반 · 2시간 · 1.5시간
function parseDurationInput(raw) {
  const s = normInput(raw).replace(/\s+/g, '');
  let mt;
  if ((mt = s.match(/^(\d+(?:\.\d+)?)시간(?:(\d{1,3})분|반)?$/))) {
    const min = Math.round(parseFloat(mt[1]) * 60) + (mt[2] ? +mt[2] : /반$/.test(s) ? 30 : 0);
    return { ok: true, min };
  }
  if ((mt = s.match(/^\+?(\d{1,4})분$/)) || (mt = s.match(/^\+(\d{1,4})$/))) return { ok: true, min: +mt[1] };
  return { ok: false };
}

// 날짜: 오늘 · 내일 · 모레 · 글피 · 3일 뒤 · 12/3 · 12.3 · 12-3 · 12월 3일 · 1203 · 2026-12-03 · 20261203 · 3일
function parseDateInput(raw, base) {
  let s = normInput(raw).replace(/\s+/g, '').replace(/\([^)]*\)$/, '').replace(/[월화수목금토일]요일$/, '').replace(/\.$/, '');
  if (!s) return { ok: false, error: '날짜를 입력해 주세요.' };
  const rel = { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 };
  if (s in rel) return { ok: true, ymd: addDays(base, rel[s]) };
  let mt;
  if ((mt = s.match(/^\+?(\d{1,3})일(?:뒤|후)$/)) || (mt = s.match(/^\+(\d{1,3})$/))) return { ok: true, ymd: addDays(base, +mt[1]) };
  let y = null, mo, d;
  if ((mt = s.match(/^(\d{4})[-./년](\d{1,2})[-./월](\d{1,2})일?$/))) { y = +mt[1]; mo = +mt[2]; d = +mt[3]; }
  else if ((mt = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +mt[1]; mo = +mt[2]; d = +mt[3]; }
  else if ((mt = s.match(/^(\d{1,2})[-./월](\d{1,2})일?$/))) { mo = +mt[1]; d = +mt[2]; }
  else if ((mt = s.match(/^(\d{1,2})(\d{2})$/))) { mo = +mt[1]; d = +mt[2]; }
  else if ((mt = s.match(/^(\d{1,2})일$/))) {
    const [by, bm] = base.split('-').map(Number);
    y = by; mo = bm; d = +mt[1];
    if (d >= 1 && d <= 31 && `${y}-${pad(mo)}-${pad(d)}` < base) { mo += 1; if (mo > 12) { mo = 1; y += 1; } }
  }
  else return { ok: false, error: '날짜 형식을 알아보지 못했어요. 예) 12/3, 12월 3일, 내일, 2026-12-03' };
  if (mo < 1 || mo > 12) return { ok: false, error: '월은 1~12 사이로 적어 주세요.' };
  const inferYear = y == null;
  if (inferYear) y = +base.slice(0, 4);
  const valid = (yy) => { const dt = new Date(yy, mo - 1, d); return d >= 1 && dt.getFullYear() === yy && dt.getMonth() === mo - 1 && dt.getDate() === d; };
  if (!valid(y)) {
    // 2/29처럼 올해엔 없는 날짜: 연도를 안 적었으면 그 날짜가 있는 가장 가까운 해(윤년)로
    const next = inferYear && mo === 2 && d === 29 ? [1, 2, 3, 4].map((k) => y + k).find(valid) : null;
    if (next) y = next;
    else return { ok: false, error: `${mo}월에는 ${d}일이 없어요.` };
  }
  let ymdStr = `${y}-${pad(mo)}-${pad(d)}`;
  // 연도 없이 지난 날짜를 적으면 내년으로 본다 (11월에 '1/5' → 내년 1월 5일)
  if (inferYear && ymdStr < base) { y += 1; if (!valid(y)) return { ok: false, error: `${mo}월에는 ${d}일이 없어요.` }; ymdStr = `${y}-${pad(mo)}-${pad(d)}`; }
  return { ok: true, ymd: ymdStr };
}

/* ---------- 입력 대상별 규칙 ---------- */

  start: { kind: 'time', title: '시작 시각 직접 입력', ph: '예) 18:30 · 1830 · 오후 6시 반', help: '24시간제나 오전·오후 둘 다 돼요. 1분 단위로 정할 수 있어요.' },
  end: { kind: 'time', title: '종료 시각 직접 입력', ph: '예) 20:00 · 90분 · 1시간 30분', help: '종료 시각이나 걸리는 시간(90분, 1시간 반)을 적어 주세요. 같은 날 시작보다 이르면 다음 날로 봐요.' },

const INPUT_MAX_DAYS = 365;

function inputCurrent(target) {

// 입력값을 검사해서 { ok, patch } 또는 { ok:false, error } 를 돌려준다 (폼은 아직 바꾸지 않음)
function evalInput(target, raw) {

  const maxDate = addDays(td, INPUT_MAX_DAYS);
  if (target === 'date') {
    const r = parseDateInput(raw, td);
    if (!r.ok) return r;
    if (r.ymd < minDate) return { ok: false, error: '지난 날짜에는 새 일정을 올릴 수 없어요.' };
    if (r.ymd > maxDate) return { ok: false, error: '1년 안의 날짜만 정할 수 있어요.' };
    return { ok: true, patch: { date: r.ymd }, label: fmtDateShort(r.ymd) };
  }
  if (target === 'start' || target === 'end') {
    if (target === 'end') {
      const du = parseDurationInput(raw);
      if (du.ok) { // 걸리는 시간으로 적으면 종료 = 시작 + 그 시간 (날짜를 넘기면 종료 날짜도 넘어간다)
        if (du.min < 5) return { ok: false, error: '5분 이상으로 적어 주세요.' };
        if (du.min > 31 * 1440) return { ok: false, error: '한 일정은 32일까지 이어질 수 있어요.' };
        const e = at(f.date, f.start) + du.min * MIN;
        return { ok: true, patch: { end: fmtHM(e), endDate: ymd(e) }, label: `${fmtDur(du.min)} 동안` };
      }
    }
    const r = parseTimeInput(raw);
    if (!r.ok) return r;
    if (target === 'end') {
      // 시각만 적으면 종료 날짜는 그대로. 같은 날인데 시작보다 이르면 다음 날로 본다
      if (f.endDate === f.date && r.hm === f.start) return { ok: false, error: '종료 시각이 시작 시각과 같아요.' };
      const endDate = f.endDate === f.date && hmToMin(r.hm) < hmToMin(f.start) ? addDays(f.date, 1) : f.endDate;
      return { ok: true, patch: { end: r.hm, endDate }, label: endDate !== f.date ? `${fmtMD(endDate)} ${r.hm}` : r.hm };
    }
    return { ok: true, patch: { start: r.hm }, label: r.hm };
  }
  if (target === 'dl') {
    const s = normInput(raw);
    if (!s.trim()) return { ok: false, error: '마감 날짜나 시각을 입력해 주세요.' };
    // "12/3 20:00", "내일 9시", "20:00", "12/3" 모두 받기
    const parts = s.split(/\s+/);
    let dPart = null, tPart = null;
    if (parts.length >= 2) { dPart = parts[0]; tPart = parts.slice(1).join(''); }
    else if (/[:시]|^(오전|오후|정오|자정)|(am|pm)$/.test(s) || /^\d{1,2}$/.test(s)) tPart = s;
    else dPart = s;
    let dl = f.dlDate, tm = f.dlTime;
    if (dPart) { const r = parseDateInput(dPart, f.date); if (!r.ok) return r; dl = r.ymd; }
    if (tPart) { const r = parseTimeInput(tPart); if (!r.ok) return r; tm = r.hm; }
    if (dl < f.date) return { ok: false, error: '마감 날짜는 시작 날짜보다 앞설 수 없어요.' };
    if (f.repeatKind !== 'none' && daysBetween(f.date, dl) > 6) return { ok: false, error: '반복 일정의 마감은 시작일부터 7일 안으로 정해 주세요.' };
    if (dl > maxDate) return { ok: false, error: '1년 안의 날짜만 정할 수 있어요.' };
    if (at(dl, tm) <= at(f.date, f.start)) return { ok: false, error: `마감은 시작(${fmtMD(f.date)} ${f.start})보다 뒤여야 해요.` };
    return { ok: true, patch: { dlDate: dl, dlTime: tm, _dlTouched: true }, label: `${fmtMD(dl)} ${tm}` };
  }
  return { ok: false, error: '알 수 없는 입력이에요.' };
}

/* ---------- 입력창 화면 ---------- */
function viewWheelInput() {
  const st = ui.input; if (!st || !ui.form) return '';

      value="${esc(st.value)}" placeholder="${esc(sp.ph)}" aria-describedby="in-help${err ? ' in-err' : ''}" ${err ? 'aria-invalid="true"' : ''} data-input-box="1">
    ${err ? `<p id="in-err" class="field-err" role="alert">${icon('alert')}${esc(err)}</p>` : ''}

  </div>`;
}
let inputHtml = '';
function renderInputLayer() {
  const host = $('#layer-input'); if (!host) return;
  const h = ui.input && ui.sheet && ui.sheet.type === 'form' ? viewWheelInput() : '';
  if (h === inputHtml) return;
  const isNew = !inputHtml && h;

  host.innerHTML = h; inputHtml = h;
  const field = $('#in-field');

/* ---------- 동작 ---------- */
// 선택기 id → 입력 대상
function wheelTarget(id) {
  if (id === 'date') return 'date';
  if (id.startsWith('start')) return 'start';
  if (id.startsWith('end')) return 'end';
  if (id.startsWith('dl')) return 'dl';
  return null;
}
function openWheelInput(target) {
  if (!ui.form || !INPUT_SPEC[target]) return;
  ui.input = { target, value: inputCurrent(target), error: '', preview: '' };
  render();
}
Object.assign(ACT, {
  wheelInput: (t) => openWheelInput(t.dataset.target),
  wheelInputCancel: () => { const tg = ui.input && ui.input.target; ui.input = null; render(); focusWheelGroup(tg); },
  wheelInputOk: () => {
    const st = ui.input; if (!st || !ui.form) return;
    const field = $('#in-field'); if (field) st.value = field.value;
    const r = evalInput(st.target, st.value);
    if (!r.ok) { st.error = r.error; st.preview = ''; render(); return; }
    const span = daysBetween(ui.form.date, ui.form.endDate); // 시작 날짜를 바꾸면 종료 날짜도 같은 간격으로 따라간다
    Object.assign(ui.form, r.patch);
    const f = ui.form;
    if (r.patch.date) {
      f.endDate = addDays(f.date, Math.max(0, span));
      f.calMonth = f.date.slice(0, 7); // 폼 달력도 그 달로
      if (f.repeatKind === 'weekly' && f.days.length === 1) f.days = [weekday(f.date)];
      if (!f._dlTouched || f.dlDate < f.date) f.dlDate = f.date;
      delete f.errors.date;
    }
    if (r.patch.start || r.patch.end) delete f.errors.time;
    if (r.patch.dlDate) delete f.errors.deadline;
    const tg = st.target;
    ui.input = null;
    rerenderForm();
    toast(`${INPUT_SPEC[tg].title.replace(' 직접 입력', '')}: ${r.label}`);
    focusWheelGroup(tg);
  },
});
function focusWheelGroup(target) {
  if (!target) return;
  const id = { date: 'date', start: 'start-h', end: 'end-h', dl: 'dl-date' }[target];
  setTimeout(() => { const w = el.sheet && el.sheet.querySelector(`.wheel[data-wheel="${id}"]`); if (w) w.focus({ preventScroll: true }); }, 30);
}
// 입력창 안 키보드: Enter 확인, Esc 취소, 입력하면서 미리보기
document.addEventListener('keydown', (ev) => {
  if (!ev.target || !ev.target.dataset || !ev.target.dataset.inputBox) return;
  if (ev.key === 'Enter') { ev.preventDefault(); ACT.wheelInputOk(); }
  if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); ACT.wheelInputCancel(); }
}, true);
document.addEventListener('input', (ev) => {
  if (!ev.target || !ev.target.dataset || !ev.target.dataset.inputBox || !ui.input) return;
  ui.input.value = ev.target.value;

/* ============================================================
   04c-voice.js — 캐릭터 목소리 (TTS, 기기 음성 엔진 사용)
   ① 설정값      : state.voice = { mode 소리 모드, speed 말 빠르기 }
   ② 읽기 다듬기 : speakable() — 화면용 글자를 귀로 듣기 좋은 말로 (18:30 → 18시 30분)
   ③ 말하기      : TTS.say(text, { pri, stage }) — 모드·중복·우선순위를 보고 읽을지 정한다
                   TTS.speak(text)                  — 버튼으로 직접 듣기 (모드와 상관없이)
   ④ 한국어 음성 : TTS.check() — 기기에 한국어 음성이 있는지 확인, 없으면 안내
   ⑤ 캐릭터 목소리 파일 : VOICE_PACKS(05b-voice-pack.js) — 미리 만든 음성 파일이 있는 대사는 파일을 틀고,
                          파일이 없는 말(일정 이름이 들어간 문장 등)만 기기 음성으로 읽는다
   캐릭터마다 목소리 높낮이·빠르기가 다르다 (01-core.js CHARACTERS[].voice)
   ============================================================ */

/* 소리 모드: 언제 소리 내어 읽을지 */
const VOICE_MODES = [
  ['off', '끄기', '소리 없이 글자로만 보여 줘요. 말풍선 옆 스피커 버튼으로는 언제든 들을 수 있어요.'],
  ['key', '중요할 때만', '시작 시간·마감 임박·마감·딴짓 감지·휴식 초과·결과만 소리로 읽어요.'],
  ['all', '모든 멘트', '말풍선이 바뀔 때마다 읽어요. 중요한 말을 읽는 중에는 끼어들지 않아요.'],
];
/* 말 빠르기: 캐릭터 기본 빠르기에 곱한다 */
const VOICE_SPEEDS = { slow: { label: '느리게', k: 0.85 }, normal: { label: '보통', k: 1 }, fast: { label: '빠르게', k: 1.2 } };

/* 상황별로 소리 낼지 (소리 모드가 켜져 있을 때만 의미 있음) */
const VOICE_EVENTS = [
  ['start', '시작·지각'], ['deadline', '마감 임박·마감'], ['slack', '딴짓·공부 확인'], ['result', '완료·실패 결과'], ['speech', '말풍선 변화'],
];
function voicePrefs() {
  if (!state.voice || typeof state.voice !== 'object') state.voice = { mode: 'off', speed: 'normal' };
  const v = state.voice;
  if (!VOICE_MODES.some(([id]) => id === v.mode)) v.mode = 'off';
  if (!VOICE_SPEEDS[v.speed]) v.speed = 'normal';
  if (!(v.volume >= 0 && v.volume <= 1)) v.volume = 1;            // 음량 0~1
  if (!v.events || typeof v.events !== 'object') v.events = {};
  for (const [id] of VOICE_EVENTS) if (typeof v.events[id] !== 'boolean') v.events[id] = true;
  if (typeof v.useClips !== 'boolean') v.useClips = true;          // 캐릭터 목소리 파일 쓰기
  return v;
}

/* ---------- ⑤ 캐릭터 목소리 파일 ---------- */
// 대사 틀(템플릿) → 정규식. {title} 같은 빈칸은 아무 글자나 맞춘다
const clipIndex = {};
function clipsFor(charId) {
  if (clipIndex[charId]) return clipIndex[charId];
  const pack = typeof VOICE_PACKS !== 'undefined' ? VOICE_PACKS[charId] : null;
  const list = [];
  if (pack && Array.isArray(pack.clips)) {
    for (const [tpl, file, mood] of pack.clips) {
      const re = new RegExp('^' + tpl.trim().replace(/[.*+?^${}()|[\]\\]/g, (c) => '\\' + c).replace(/\\\{\w+\\\}/g, '(.+?)') + '$');
      list.push({ tpl, re, src: pack.dir + file + '.mp3', mood: mood || '' });
    }
  }
  return (clipIndex[charId] = { pack, list });
}
// 화면에 나온 문장 → 미리 만든 음성 파일 (없으면 null)
function clipFor(text, charId = (persona() || {}).id) {
  const t = String(text || '').trim();
  if (!t) return null;
  const { list } = clipsFor(charId);
  return list.find((c) => c.re.test(t)) || null;
}

/* 화면 글자 → 읽기 좋은 말 */
function speakable(text) {
  return String(text || '')
    .replace(/(\d{1,2}):(\d{2})/g, (_, h, mm) => `${Number(h)}시${Number(mm) ? ' ' + Number(mm) + '분' : ''}`) // 18:30 → 18시 30분
    .replace(/(\d)\s*[–~]\s*(\d)/g, '$1에서 $2')     // 18시–20시 → 18시에서 20시
    .replace(/\s*[–~]\s*/g, '에서 ')
    .replace(/…+/g, ', ')
    .replace(/[·•|]/g, ', ')
    .replace(/[“”"‘’'«»()[\]{}<>]/g, ' ')
    .replace(/\+(\d)/g, '플러스 $1')
    .replace(/[!?.]{2,}/g, (s) => s[0])
    .replace(/\s+/g, ' ')
    .trim();
}

const TTS = {
  voice: null,          // 웹: 고른 한국어 음성
  koOK: null,           // 한국어 음성: null 모름 · true 있음 · false 없음
  voiceName: '',        // 설정 화면에 보여 줄 음성 이름
  busyUntil: 0,         // 지금 읽는 말이 끝날 예상 시각 (ms)
  lastPri: '',          // 마지막으로 읽은 말의 우선순위
  last: { text: '', at: 0 },
  warned: false,        // '한국어 음성 없음' 안내를 이미 했는지
  blocked: false,       // 웹: 화면을 누르기 전이라 브라우저가 소리를 막음

  ok() {
    if (NATIVE.on) return !!NATIVE.Speech;
    try { return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; }
  },
  init() {
    voicePrefs();
    if (!this.ok()) return;
    if (NATIVE.on) { setTimeout(() => this.check(), 1500); return; } // 기기 음성 엔진은 켜지는 데 시간이 걸린다
    const pick = () => {
      try {
        const vs = speechSynthesis.getVoices();
        if (!vs.length) return; // 목록이 아직 안 옴 (voiceschanged 때 다시)
        this.voice = vs.find((v) => /^ko(-|_|$)/i.test(v.lang) && v.localService) || vs.find((v) => /^ko/i.test(v.lang)) || null;
        this.koOK = !!this.voice; this.voiceName = this.voice ? this.voice.name : '';
      } catch (e) { /* 무시 */ }
    };
    pick();
    try { speechSynthesis.addEventListener('voiceschanged', pick); } catch (e) { /* 무시 */ }
    try { document.addEventListener('visibilitychange', () => { if (document.hidden) this.stop(); }); } catch (e) { /* 무시 */ }
  },
  /* 한국어 음성이 있는지 다시 확인 (설정 화면 진입·앱 복귀 때) */
  async check() {
    if (!this.ok()) { this.koOK = false; return false; }
    if (!NATIVE.on) { try { this.voice = speechSynthesis.getVoices().find((v) => /^ko/i.test(v.lang)) || this.voice; } catch (e) { /* 무시 */ } this.koOK = !!this.voice; this.voiceName = this.voice ? this.voice.name : ''; return this.koOK; }
    try {
      const r = await NATIVE.Speech.isLanguageSupported({ lang: 'ko-KR' });
      this.koOK = !!(r && r.supported); this.voiceName = this.koOK ? '기기 한국어 음성' : '';
    } catch (e) { this.koOK = null; } // 엔진이 아직 준비 안 됨 → 모름
    return this.koOK;
  },
  /* 캐릭터 목소리 × 말 빠르기 × 단계 (4·5단계는 살짝 빠르고 높게 — 부풀어 오른 느낌) */
  params(stage = 0) {
    const c = persona().voice || { pitch: 1, rate: 1 };
    const k = VOICE_SPEEDS[voicePrefs().speed].k;
    const hot = Math.max(0, stage - 3);
    return { rate: clamp(c.rate * k * (1 + hot * 0.05), 0.5, 2), pitch: clamp(c.pitch + hot * 0.05, 0.5, 2) };
  },
  allowed(pri) {
    const mode = voicePrefs().mode;
    if (pri === 'manual') return true;
    if (mode === 'off') return false;
    return mode === 'all' || pri === 'key';
  },
  /* 자동으로 읽을 때: pri 'key' 중요한 순간 · 'all' 그 밖의 멘트 */
  say(text, o = {}) {
    const pri = o.pri || 'all';
    if (!this.allowed(pri)) return false;
    if (o.ev && voicePrefs().events[o.ev] === false) return false; // 상황별 설정에서 끈 상황
    return this.speak(text, { ...o, pri });
  },
  /* 실제로 읽기 */
  speak(text, o = {}) {
    const t = speakable(text);
    if (!t) return false;
    // 캐릭터 목소리 파일이 있는 대사면 파일을 튼다. 실패하면 기기 음성으로 대신 읽는다
    const clip = voicePrefs().useClips && !o.device ? clipFor(text) : null;
    if (!clip && !this.ok()) return false;
    const ms = Date.now(), pri = o.pri || 'manual';
    if (pri !== 'manual') {
      if (t === this.last.text && ms - this.last.at < 15000) return true;              // 같은 말을 15초 안에 또 읽지 않음
      if (pri === 'all' && this.lastPri === 'key' && ms < this.busyUntil) return false; // 중요한 말 읽는 중엔 끼어들지 않음
    }
    this.last = { text: t, at: ms }; this.lastPri = pri;
    const { rate, pitch } = this.params(o.stage || 0);
    this.busyUntil = ms + Math.min(15000, 500 + (t.length * 150) / rate);
    if (clip) { this.playClip(clip, t, o); return true; }
    return this.speakDevice(t, rate, pitch);
  },
  /* 미리 만든 음성 파일 재생 (말 빠르기는 재생 속도로, 음량은 설정값으로) */
  playClip(clip, t, o) {
    this.stopDevice();
    try {
      if (this.audio) { this.audio.pause(); this.audio = null; }
      const a = new Audio(clip.src);
      a.volume = voicePrefs().volume;
      a.playbackRate = VOICE_SPEEDS[voicePrefs().speed].k;
      try { a.preservesPitch = true; } catch (e) { /* 무시 */ }
      a.onended = () => { if (this.audio === a) { this.audio = null; this.busyUntil = 0; } };
      a.onerror = () => { if (this.audio === a) { this.audio = null; this.clipFail = (this.clipFail || 0) + 1; const p = this.params(o.stage || 0); this.speakDevice(t, p.rate, p.pitch); } };
      this.audio = a; this.lastClip = clip.src;
      const pr = a.play();
      if (pr && pr.catch) pr.catch((e) => {
        if (this.audio !== a) return;
        this.audio = null;
        if (e && e.name === 'NotAllowedError') { this.blocked = true; return; } // 브라우저가 자동 재생을 막음 → 다음 터치 뒤에 재생됨
        const p = this.params(o.stage || 0); this.speakDevice(t, p.rate, p.pitch);
      });
    } catch (e) { const p = this.params(o.stage || 0); this.speakDevice(t, p.rate, p.pitch); }
  },
  /* 기기 음성으로 읽기 */
  speakDevice(t, rate, pitch) {
    if (!this.ok()) return false;
    const vol = voicePrefs().volume;
    if (NATIVE.on) { // 진짜 앱: 안드로이드 기기 음성 엔진
      const S = NATIVE.Speech;
      const go = (retry) => S.speak({ text: t, lang: 'ko-KR', rate, pitch, volume: vol, category: 'ambient' })
        .then(() => { this.koOK = true; })
        .catch((e) => {
          const msg = String((e && e.message) || e || '');
          if (/not supported/i.test(msg)) { this.koOK = false; this.warnNoKorean(); }
          else if (/not yet initialized|not available/i.test(msg) && retry) setTimeout(() => go(false), 900); // 엔진 준비 중 → 한 번 더
        });
      S.stop().catch(() => {}).then(() => go(true));
      return true;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ko-KR'; if (this.voice) u.voice = this.voice;
      u.rate = rate; u.pitch = pitch; u.volume = vol;
      u.onerror = (e) => {
        if (e && e.error === 'not-allowed') this.blocked = true; // 화면을 한 번도 안 눌러 브라우저가 막음
        else if (e && (e.error === 'language-unavailable' || e.error === 'voice-unavailable')) { this.koOK = false; this.warnNoKorean(); }
      };
      u.onstart = () => { this.blocked = false; };
      speechSynthesis.speak(u);
      if (this.koOK === false) this.warnNoKorean();
      return true;
    } catch (e) { return false; }
  },
  stop() {
    this.busyUntil = 0; this.lastPri = '';
    if (this.audio) { try { this.audio.pause(); } catch (e) { /* 무시 */ } this.audio = null; }
    this.stopDevice();
  },
  stopDevice() {
    if (!this.ok()) return;
    if (NATIVE.on) { NATIVE.Speech.stop().catch(() => {}); return; }
    try { speechSynthesis.cancel(); } catch (e) { /* 무시 */ }
  },
  warnNoKorean() {
    if (this.warned) return;
    this.warned = true;
    toast(NATIVE.on ? '기기에 한국어 음성이 없어요. 나 탭 > 목소리에서 음성 설치를 눌러 주세요.' : '이 브라우저에 한국어 음성이 없어서 다른 음성으로 읽어요.');
  },
  /* 안드로이드: 음성 데이터 설치 화면 열기 */
  install() {
    if (!NATIVE.on || !NATIVE.Speech) return;
    NATIVE.Speech.openInstall().catch(() => toast('음성 설정을 열지 못했어요. 폰 설정 > 일반 > 텍스트 음성 변환에서 바꿔 주세요.'));
  },
};

      <p class="set-title">음량 <b class="vol-val">${vol}%</b></p>

        ${NATIVE.on && TTS.koOK === false ? `<button class="btn ghost sm" data-act="voiceInstall">음성 설치</button>` : ''}</div>

Object.assign(ACT, {

/* 음량 막대: 끄는 동안에는 숫자만 바꾸고, 손을 떼면 저장하고 짧게 들려준다 */
document.addEventListener('input', (ev) => {

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (!t || !t.dataset || t.dataset.actInput !== 'voiceVolume') return;

});

/* ============================================================
   04d-account.js — 로그인 상태 확인
   ① 로그인 기록      : diagBegin / diagStep / diagFail / diagDone
                        로그인·앱 복귀·재검증 때 단계마다 성공/실패를 남긴다 (토큰 값은 절대 저장하지 않음)
   ② 진짜 로그인 확인 : checkRealLogin(kind) — 카카오 서버에 토큰·사용자 정보를 다시 물어보고 앱 회원·세션과 맞춰 본다
   ③ 로그인 성공 안내 : showLoginWelcome(m, mode) — 모든 단계가 확인됐을 때만 "카카오 계정으로 로그인했어요!"
   ④ 나 탭 계정 상태  : accountStatusBlock(m) — 로그인 방식·카카오 연결·앱 세션 (회원번호는 보여 주지 않음)
   ⑤ 개발자 진단      : viewLoginDiag() + ACT.diagRecheck — 단계별 결과, 실패 위치, 카카오 회원번호(여기서만)
   ============================================================ */

/* 진단 단계: [키, 이름, 성공 글자, 실패 글자] */
const DIAG_STEPS = [
  ['config', '앱 설정 (앱 키·키 해시)', '정상', '설정 안 됨'],
  ['auth', '카카오 인증', '성공', '실패'],
  ['token', '액세스 토큰 발급', '성공', '실패'],
  ['me', '사용자 정보 조회', '성공', '실패'],
  ['kakaoId', '카카오 회원번호', '확인', '미확인'],
  ['member', '잡도리앱 회원 확인', '성공', '실패'],
  ['session', '서비스 로그인 세션', '활성', '비활성'],
];
const DIAG_KIND = { login: '로그인', restore: '앱 실행·복귀 확인', recheck: '재검증', logout: '로그아웃' };
let diagCur = null; // 지금 진행 중인 단계 (실패했을 때 어느 단계인지 알기 위해)

/* ① 로그인 기록 */
function diagBegin(mode, kind) {
  state.diag = { mode, kind, at: Date.now(), steps: {}, failStep: null, code: null, msg: null, kakaoId: null, expiresIn: null, done: false };
  diagCur = DIAG_STEPS[0][0];
  return state.diag;
}
// 단계 성공 → 다음 단계를 진행 중으로
function diagStep(key, extra) {
  const d = state.diag; if (!d) return;
  d.steps[key] = 'ok';
  if (extra) Object.assign(d, extra);
  const i = DIAG_STEPS.findIndex(([k]) => k === key);
  diagCur = DIAG_STEPS[i + 1] ? DIAG_STEPS[i + 1][0] : null;
}
// 흉내 모드: 실제 카카오와 통신하지 않은 단계
function diagSim(key) { const d = state.diag; if (d) d.steps[key] = 'sim'; }
// 단계 실패 → 그 뒤 단계는 확인하지 않음. 메시지에서 토큰처럼 보이는 긴 문자열은 지운다
function diagFail(key, code, msg) {
  const d = state.diag; if (!d) return;
  const k = key || diagCur || 'auth';
  d.steps[k] = 'fail';
  d.failStep = k; d.code = code || 'UNKNOWN';
  d.msg = msg ? String(msg).replace(/[A-Za-z0-9_\-.]{30,}/g, '[가림]').slice(0, 160) : null;
  let after = false;
  for (const [s] of DIAG_STEPS) { if (after && !d.steps[s]) d.steps[s] = 'skip'; if (s === k) after = true; }
  d.done = true; diagCur = null;
  save();
}
function diagDone() { const d = state.diag; if (d) { d.done = true; diagCur = null; save(); } }

/* ② 진짜 카카오 로그인 상태 확인 (앱 실행·복귀·재검증 공용)
   돌려주는 값: { ok, failStep, code, network } */
async function kakaoTokenCheck() {
  try {
    const ti = await NATIVE.Kakao.tokenInfo();
    return { ok: true, id: ti && ti.id ? String(ti.id) : '', expiresIn: ti && ti.expiresIn };
  } catch (e) {
    const code = (e && e.code) || '', msg = String((e && e.message) || '');
    // 예전 APK(이 기능이 없는 버전)면 토큰 보유 여부로 대신 판단
    if (code === 'UNIMPLEMENTED' || /not implemented/i.test(msg)) {
      try { const st = await NATIVE.Kakao.status(); return st.hasToken ? { ok: true, id: '', legacy: true } : { ok: false, code: 'NO_TOKEN' }; } catch (e2) { return { ok: false, code: 'UNKNOWN' }; }
    }
    return { ok: false, code: code || 'UNKNOWN', msg };
  }
}
async function checkRealLogin(kind) {
  diagBegin('real', kind);
  const fail = (step, code, msg) => { diagFail(step, code, msg); return { ok: false, failStep: step, code, network: code === 'NETWORK' }; };
  let st;
  try { st = await NATIVE.Kakao.status(); } catch (e) { return fail('config', (e && e.code) || 'UNKNOWN', e && e.message); }
  if (!st.configured) return fail('config', 'NOT_CONFIGURED');
  diagStep('config');
  if (!st.hasToken) return fail('auth', 'NO_TOKEN', '이 기기에 카카오 로그인 기록이 없어요');
  diagStep('auth');
  const tk = await kakaoTokenCheck();
  if (!tk.ok) return fail('token', tk.code, tk.msg);
  diagStep('token', { expiresIn: tk.expiresIn ?? null });
  let u;
  try { u = await NATIVE.Kakao.me(); } catch (e) { return fail('me', (e && e.code) || 'UNKNOWN', e && e.message); }
  diagStep('me');
  if (!u || u.id == null || u.id === '') return fail('kakaoId', 'NO_USER_ID');
  if (tk.id && tk.id !== String(u.id)) return fail('kakaoId', 'ID_MISMATCH', '토큰 주인과 사용자 정보가 달라요');
  diagStep('kakaoId', { kakaoId: String(u.id) });
  const kid = 'kakao:' + u.id, mid = state.memberByKakao[kid];
  if (!mid || !state.members[mid]) return fail('member', 'NO_MEMBER', '이 카카오 계정으로 가입한 잡도리 회원이 없어요');
  diagStep('member');
  const s = state.session;
  if (!s) return fail('session', 'NO_SESSION', '잡도리앱에서 로그아웃한 상태예요 (카카오 로그인은 남아 있음)');
  if (s.expired) return fail('session', 'EXPIRED');
  if (s.kakaoId !== kid || s.memberId !== mid) return fail('session', 'MISMATCH', '세션의 회원과 카카오 계정이 달라요');
  diagStep('session');
  diagDone();
  return { ok: true, user: u };
}

/* 흉내 모드(웹 미리보기·앱의 흉내 로그인) 진단: 카카오 단계는 '흉내', 회원·세션은 실제로 확인 */
function checkFakeLogin(kind) {
  diagBegin('fake', kind);
  ['config', 'auth', 'token', 'me', 'kakaoId'].forEach(diagSim);
  const s = state.session;
  const mid = s && state.memberByKakao[s.kakaoId];
  if (!s || !mid || !state.members[mid]) { diagFail(s ? 'member' : 'session', s ? 'NO_MEMBER' : 'NO_SESSION'); return false; }
  diagStep('member');
  if (s.expired) { diagFail('session', 'EXPIRED'); return false; }
  diagStep('session');
  diagDone();
  return true;
}
function isRealSession() { return !!(NATIVE.on && state.session && state.session.real); }

/* ③ 로그인 성공 안내 (모든 단계가 확인됐을 때만 부른다) */
let welcomeTimer = null;
function showLoginWelcome(m, mode) {
  const b = $('#layer-banner'); if (!b || !m) return;
  const real = mode === 'real';
  const photo = real && (m.thumbnailUrl || m.profileImageUrl);
  const name = m.nickname || '카카오 사용자';
  b.innerHTML = `<div class="banner login-ok" role="status">
      <span class="avatar sm" aria-hidden="true">${esc(name.slice(0, 1))}${photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
      <span class="bn-text"><b>${real ? '카카오 계정으로 로그인했어요!' : '흉내 로그인으로 들어왔어요'}</b><span>${esc(name)} 님${real ? '' : ' · 실제 카카오 인증은 하지 않았어요'}</span></span>
      <span class="ok-mark">${icon(real ? 'check' : 'info')}</span></div>`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  clearTimeout(welcomeTimer); clearTimeout(bannerTimer);
  welcomeTimer = setTimeout(() => b.classList.remove('show'), 3600);
}

/* ④ 나 탭 계정 상태 */
function accountStatusBlock(m) {
  const real = isRealSession();
  const s = state.session;
  const link = s && state.kakao[s.kakaoId];
  const linked = real ? !m.unlinked : !!(link && link.linked);
  const active = !!(s && !s.expired && s.memberId === m.id);
  const photo = real && (m.thumbnailUrl || m.profileImageUrl);
  const since = s && s.at ? `${fmtDateShort(ymd(real ? s.realAt || s.at : s.at))}부터` : '';
  return `<div class="profile">
        <span class="avatar" aria-hidden="true">${esc((m.nickname || '카').slice(0, 1))}${photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
        <div><p class="pf-name">${esc(m.nickname || '카카오 사용자')}</p><p class="pf-sub">카카오 계정</p></div>
      </div>
      <ul class="kv acct-state" aria-label="로그인 상태">
        <li><span>로그인 방식</span><b>${KAKAO_SYMBOL}카카오${real ? '' : ' <em class="sim-tag">흉내 모드 · 실제 인증 아님</em>'}</b></li>
        <li><span>카카오 계정 연결</span><b class="${linked ? 'yes' : 'no'}">${icon(linked ? 'check' : 'x')}${linked ? '연결됨' : '끊김'}</b></li>
        <li><span>잡도리앱 로그인</span><b class="${active ? 'yes' : 'no'}">${icon(active ? 'check' : 'x')}${active ? `로그인 중${since ? ' · ' + since : ''}` : '로그아웃됨'}</b></li>
      </ul>
      <button class="list-btn" data-act="acct" data-v="logout">${icon('logout')}<span class="lb-text"><b>로그아웃</b><small>${real ? '이 폰에서만 나가요. 카카오 연결은 남아 있어 다음엔 동의 없이 바로 들어와요.' : '이 기기에서만 나가요. 카카오 인증은 남아 있어 다음엔 바로 들어와요.'}</small></span>${icon('chevron', 'muted')}</button>`;
}

/* ⑤ 개발자 진단 화면 */
function viewLoginDiag() {
  const d = state.diag;
  const real = NATIVE.on && !state.fakeLogin;
  const modeTxt = d ? (d.mode === 'real' ? '진짜 카카오 로그인 (카카오 서버에 확인함)' : '흉내 모드 — 카카오 서버에 연결하지 않았어요') : (real ? '진짜 카카오 로그인' : '흉내 모드');
  const row = ([k, name, okT, failT]) => {
    const v = d && d.steps[k];
    const [cls, ic, txt] = v === 'ok' ? ['ok', 'check', okT] : v === 'fail' ? ['bad', 'x', failT] : v === 'sim' ? ['sim', 'info', '흉내'] : v === 'skip' ? ['skip', 'dot', '확인 안 함'] : ['skip', 'dot', '기록 없음'];
    return `<li class="dg-row dg-${cls}"><span class="dg-ic">${icon(ic)}</span><span class="dg-name">${name}</span><b>${txt}</b></li>`;
  };
  const failName = d && d.failStep ? (DIAG_STEPS.find(([k]) => k === d.failStep) || [])[1] : '';
  const time = d ? new Date(d.at) : null;
  const hhmmss = time ? `${pad(time.getHours())}:${pad(time.getMinutes())}:${pad(time.getSeconds())}` : '';
  return sheetWrap(`${sheetHead('로그인 진단 (개발자용)', 'closeSheet', '실제로 어디까지 로그인됐는지 단계별로 확인해요')}
    <div class="sheet-body">
      <p class="dg-mode ${d && d.mode === 'real' ? 'real' : 'sim'}">${icon(d && d.mode === 'real' ? 'lock' : 'info')}${modeTxt}</p>
      ${d ? `<p class="hint">마지막 확인: ${DIAG_KIND[d.kind] || d.kind} · ${hhmmss}</p>` : '<p class="hint">아직 기록이 없어요. 아래 \'다시 확인\'을 눌러 주세요.</p>'}
      <ul class="dg-list">${DIAG_STEPS.map(row).join('')}</ul>
      ${d && d.failStep ? `<div class="notice err dg-fail">${icon('alert')}<div><b>${failName} 단계에서 멈췄어요</b><p>코드 ${esc(d.code || '')}${d.msg ? ' · ' + esc(d.msg) : ''}</p></div></div>` : ''}
      <dl class="facts">
        <div><dt>카카오 회원번호</dt><dd>${d && d.kakaoId ? esc(d.kakaoId) : '-'}</dd></div>
        <div><dt>토큰 남은 시간</dt><dd>${d && d.expiresIn ? fmtDur(Math.round(d.expiresIn / 60)) : '-'}</dd></div>
        <div><dt>잡도리 세션</dt><dd>${state.session ? (state.session.expired ? '만료' : `있음 · ${state.session.method || ''}`) : '없음'}</dd></div>
      </dl>
      <p class="fine dark">액세스 토큰·리프레시 토큰 같은 인증 값은 화면과 기록에 남기지 않아요. 카카오 회원번호는 이 화면에서만 보여요.</p>
    </div>
    <div class="sheet-foot"><div class="two"><button class="btn secondary" data-act="closeSheet">닫기</button><button class="btn primary" data-act="diagRecheck" ${ui.diagBusy ? 'aria-busy="true" disabled' : ''}>${icon('repeat')}${ui.diagBusy ? '확인 중…' : '다시 확인'}</button></div></div>`);
}

Object.assign(ACT, {
  openDiag: () => { openSheet({ type: 'diag' }); },
  diagRecheck: async () => {
    if (ui.diagBusy) return;
    ui.diagBusy = true; render();
    let r;
    if (NATIVE.on && !state.fakeLogin) {
      r = await checkRealLogin('recheck');
      // 카카오 쪽 인증이 확실히 끝났으면(네트워크 문제 제외) 앱 세션도 만료로 돌린다
      if (!r.ok && state.session && state.session.real && ['token', 'me', 'kakaoId'].includes(r.failStep) && !r.network) {
        state.session = { ...state.session, expired: true }; ui.login = { busy: false, error: 'tokenExpired' };
      }
    } else r = { ok: checkFakeLogin('recheck') };
    ui.diagBusy = false;
    save(); render();
    toast(r.ok ? '모든 단계가 확인됐어요.' : '멈춘 단계를 확인해 주세요.');
  },
});

/* =========================================================
   05-native: 진짜 안드로이드 앱에서만 쓰는 기능
   ① 진짜 카카오 로그인 (카카오톡 → 동의 화면 → 개인정보 받기)
   ② 로그인 유지 확인 / 로그아웃 / 카카오 로그아웃 / 연결 끊기 / 탈퇴
   ③ 시작·마감 로컬 알림 (앱이 꺼져 있어도 울림)
   ④ 기기 음성(TTS), 상태 표시줄, 안드로이드 뒤로 가기 버튼
   브라우저에서는 NATIVE.on 이 false 라서 아무 일도 하지 않는다.
   ========================================================= */

/* ---------- ① 진짜 카카오 로그인 ---------- */
// 카카오 쪽 실패 코드 → 로그인 화면에 보여 줄 안내 종류
function kakaoErrorToLogin(e) {
  const code = (e && e.code) || 'UNKNOWN';
  const msg = (e && e.message) || '';
  const detail = `${code}${msg ? ' · ' + msg : ''}`;
  if (code === 'CANCELLED') return { note: 'cancel' };
  if (code === 'ACCESS_DENIED') return { note: 'denyRequired' };
  if (code === 'NOT_CONFIGURED') return { error: 'notConfigured', detail };
  if (code === 'NETWORK') return { error: 'network', detail };
  if (/Misconfigured|InvalidClient|key_hash|KOE0?0[49]|KOE101|disabled/i.test(detail)) return { error: 'keyHash', detail };
  return { error: 'loginFailed', detail };
}

async function nativeLogin(opt = {}) {
  if (ui.login.busy) { state.ignoredClicks++; save(); renderConsole(); return; }
  ui.login = { busy: true, step: opt.forceAccount ? 'account' : 'opening' };
  render();
  diagBegin('real', 'login'); // 단계별 결과 기록 시작 (개발자 진단에서 확인)
  try {
    const st = await NATIVE.Kakao.status();
    if (!st.configured) { diagFail('config', 'NOT_CONFIGURED'); ui.login = { busy: false, error: 'notConfigured', detail: `패키지 ${st.packageName} · 키 해시 ${st.keyHash}` }; render(); return; }
    diagStep('config');
    // 카카오 토큰이 남아 있으면(앱 로그아웃만 했던 경우) 카카오톡을 다시 열지 않고 바로 들어간다
    if (st.hasToken && !opt.forceAccount) {
      try { const u = await NATIVE.Kakao.me(); diagStep('auth'); await completeNativeLogin({ ...u, method: 'token' }); return; } catch (e) { /* 토큰 만료 → 아래에서 새로 로그인 */ }
    }
    if (!opt.forceAccount && !st.talkAvailable) { ui.login.step = 'account'; render(); }
    // 여기서 카카오톡(또는 브라우저)이 열리고, 카카오의 진짜 동의 화면이 뜬다
    const u = await NATIVE.Kakao.login({ mode: opt.forceAccount ? 'account' : 'auto' });
    diagStep('auth');
    await completeNativeLogin(u);
  } catch (e) {
    const r = kakaoErrorToLogin(e);
    diagFail(r.note === 'cancel' || r.note === 'denyRequired' ? 'auth' : null, (e && e.code) || 'UNKNOWN', e && e.message);
    ui.login = { busy: false, ...r };
    render();
  }
}

// 카카오가 돌려준 사용자 정보로 잡도리 회원을 찾거나 새로 만든다 (내부 계정은 카카오 회원번호로만 연결)
async function completeNativeLogin(u) {
  // ② 토큰이 실제로 발급·저장됐는지 카카오 서버에 확인 (토큰 값은 받지 않음)
  const tk = await kakaoTokenCheck();
  if (!tk.ok) { diagFail('token', tk.code, tk.msg); ui.login = { busy: false, error: 'loginFailed', detail: `토큰 확인 실패 · ${tk.code}` }; render(); return; }
  diagStep('token', { expiresIn: tk.expiresIn ?? null });
  // ③ 사용자 정보(/v2/user/me)를 받았는지, ④ 회원번호가 토큰 주인과 같은지
  if (!u || u.id == null || u.id === '') { diagFail('me', 'NO_USER'); ui.login = { busy: false, error: 'loginFailed', detail: '사용자 정보를 받지 못했어요' }; render(); return; }
  diagStep('me');
  if (tk.id && tk.id !== String(u.id)) { diagFail('kakaoId', 'ID_MISMATCH'); ui.login = { busy: false, error: 'loginFailed', detail: '토큰 주인과 사용자 정보가 달라요' }; render(); return; }
  diagStep('kakaoId', { kakaoId: String(u.id) });
  const kid = 'kakao:' + u.id;
  const consent = { terms: true, privacy: true, email: !!u.email, profile: !!u.profileImage };
  state.kakao[kid] = { linked: true, token: true, consent, real: true };
  ui.login = { busy: true, step: 'authok' }; render(); await wait(350);
  ui.login.step = 'member'; render(); await wait(300);
  let mid = state.memberByKakao[kid];
  let isNew = false;
  if (!mid || !state.members[mid]) {
    ui.login.step = 'create'; render(); await wait(350);
    mid = createMember(kid, { nickname: u.nickname || '카카오 사용자', email: u.email || null }, consent).id;
    isNew = true;
  }
  const mm = state.members[mid];
  // ⑤ 잡도리 회원 확인: 카카오 회원번호 ↔ 회원이 제대로 이어졌는지
  if (!mm || state.memberByKakao[kid] !== mid) { diagFail('member', 'MEMBER_LINK'); ui.login = { busy: false, error: 'loginFailed', detail: '회원 연결을 확인하지 못했어요' }; render(); return; }
  diagStep('member');
  const relinked = !!mm.unlinked;
  applyKakaoProfile(mm, u);
  mm.unlinked = false;
  state.session = { kakaoId: kid, memberId: mid, method: u.method || 'talk', at: now(), realAt: Date.now(), real: true };
  // ⑥ 서비스 세션: 저장소에 실제로 남았는지 다시 읽어서 확인 (앱을 껐다 켜도 유지되는지)
  save();
  let persisted = false;
  try { const back = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); persisted = !!(back && back.session && back.session.memberId === mid && back.session.kakaoId === kid); } catch (e) { persisted = false; }
  if (persisted) diagStep('session'); else diagFail('session', 'STORAGE', '세션을 저장하지 못했어요 (앱을 다시 켜면 로그아웃될 수 있음)');
  diagDone();
  ui.login = { busy: false };
  ui.tab = 'today'; ui.selDate = today(); ui.onb = { step: 0, stage: 3 }; ui.focusKey = null;
  ui.scopes = null;
  state.settledDay = today();
  save(); render();
  if (persisted) showLoginWelcome(mm, 'real'); // 모든 단계가 확인됐을 때만 성공 안내
  else toast('로그인은 됐지만 저장소에 기록하지 못했어요. 나 > 로그인 진단을 확인해 주세요.');
  if (!isNew && relinked) toast('다시 연결됐어요. 기록은 그대로예요.');
}

// 카카오에서 받은 최신 개인정보를 회원 정보에 반영 (동의 안 한 항목은 빈 값)
function applyKakaoProfile(mm, u) {
  mm.kakaoUserId = String(u.id);
  if (u.nickname) mm.nickname = u.nickname;
  mm.email = u.email || null;
  mm.profileImageUrl = u.profileImage || '';
  mm.thumbnailUrl = u.thumbnail || '';
  mm.profileImage = !!u.profileImage;
  mm.connectedAt = u.connectedAt || mm.connectedAt || 0;
  mm.consent = { terms: true, privacy: true, email: !!u.email, profile: !!u.profileImage };
  mm.realKakao = true;
}

// 앱을 다시 켰을 때: 카카오 토큰이 아직 살아 있는지 확인하고 프로필을 새로 받아 온다
async function nativeRestoreSession() {
  const s = state.session;
  if (!s || !s.real || s.expired) return;
  const r = await checkRealLogin('restore'); // 토큰 → 사용자 정보 → 회원 → 세션 순서로 다시 확인
  if (r.ok) {
    const mm = state.members[s.memberId];
    if (mm) applyKakaoProfile(mm, r.user);
    save(); render();
    return;
  }
  if (r.network) return; // 오프라인이면 그대로 쓰게 둔다
  if (['config', 'auth', 'token', 'me', 'kakaoId', 'member'].includes(r.failStep)) {
    state.session = { ...s, expired: true };
    ui.login = { busy: false, error: 'tokenExpired' };
  }
  save(); render();
}

// 동의 내역 (나 탭에서 보여 줌)
async function loadKakaoScopes() {
  if (!NATIVE.on || !state.session || !state.session.real || ui.scopesLoading) return;
  ui.scopesLoading = true;
  try { const r = await NATIVE.Kakao.scopes(); ui.scopes = r.scopes || []; }
  catch (e) { ui.scopes = { error: (e && e.code) || 'UNKNOWN' }; }
  ui.scopesLoading = false;
  render();
}

/* ---------- ② 계정 처리 (진짜 카카오 API 호출) ---------- */
async function nativeAccount(v) {
  const m = member();
  const kid = state.session && state.session.kakaoId;
  try {
    if (v === 'kakaoLogout') await NATIVE.Kakao.logout();
    if (v === 'unlink' || v === 'withdraw') await NATIVE.Kakao.unlink();
  } catch (e) {
    const code = (e && e.code) || '';
    if (code === 'NETWORK') { toast('인터넷이 연결돼야 카카오에 알릴 수 있어요. 연결 후 다시 해 주세요.'); return false; }
    // 이미 연결이 끊겼거나 토큰이 없으면 그대로 진행
    if (!/NO_TOKEN|TokenNotFound|InvalidToken|NotRegisteredUser/i.test(code + ' ' + (e && e.message))) { toast(`카카오 처리 중 문제가 생겼어요 (${code || '오류'}).`); return false; }
  }
  if (kid) {
    if (v === 'kakaoLogout' && state.kakao[kid]) state.kakao[kid].token = false;
    if (v === 'unlink') { state.kakao[kid] = { linked: false, token: false }; if (m) m.unlinked = true; }
    if (v === 'withdraw') { if (m) delete state.members[m.id]; delete state.memberByKakao[kid]; state.kakao[kid] = { linked: false, token: false }; }
  }
  return true;
}

/* ---------- ③ 시작·마감 알림 (로컬 알림) ---------- */
const NOTIF = {
  CHANNEL: 'jabdori-nag',
  sig: null,
  perm: 'unknown',       // granted | denied | prompt | unknown
  pending: 0,
  timer: null,
  async init() {
    if (!NATIVE.on || !NATIVE.Notif) return;
    try {
      await NATIVE.Notif.createChannel({ id: this.CHANNEL, name: '미루먼지 잔소리', description: '잡도리 일정 시작·마감 알림', importance: 4, visibility: 1, vibration: true });
    } catch (e) { /* 이미 있음 */ }
    try { const p = await NATIVE.Notif.checkPermissions(); this.perm = p.display; } catch (e) { /* 무시 */ }
    // 알림을 누르면 그 일정의 집중 모드로
    try {
      NATIVE.Notif.addListener('localNotificationActionPerformed', (a) => {
        const key = a && a.notification && a.notification.extra && a.notification.extra.key;
        if (!key || !member()) return;
        const st = curOcc(key);
        ui.sheet = null; ui.result = null;
        ui.focusKey = st && ACTIVE_KINDS.includes(st.kind) ? key : null; // 진행 중이면 집중 모드, 아니면 오늘 화면(시작 버튼)
        ui.tab = 'today'; ui.selDate = splitKey(key)[1];
        render();
      });
    } catch (e) { /* 무시 */ }
    this.schedule(true);
  },
  async ask() {
    if (!NATIVE.on || !NATIVE.Notif) return false;
    try { const r = await NATIVE.Notif.requestPermissions(); this.perm = r.display; } catch (e) { /* 무시 */ }
    this.schedule(true); render();
    return this.perm === 'granted';
  },
  // 앞으로 7일 동안 울릴 알림 목록 만들기 (잡도리 일정만, 이미 끝낸 회차는 제외)
  plan() {
    const m = member();
    if (!m || !m.onboarded || !state.realTime || state.notifOff) return [];
    const nowMs = Date.now();
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(ymd(nowMs), i);
      for (const t of m.tasks) {
        if (!occursOn(t, d)) continue;
        const key = occKey(t.id, d);
        const run = m.runs[key];
        if (run && (run.status === 'done' || run.status === 'failed')) continue;
        const w = occWindow(t, d);
        const started = run && run.startedAt;
        const N = persona().lines.notif; // 알림 문구도 캐릭터 말투로 (01-core.js lines.notif)
        const add = (ms, kind, tpl, extra = {}) => { if (ms > nowMs + 30 * 1000) out.push({ ms, kind, key, title: fillLine(tpl[0], { title: t.title, ...extra }), body: fillLine(tpl[1], { title: t.title, ...extra }) }); };
        // 사용자가 고른 알림 (일반·잡도리 모두): 시작 n분 전
        for (const a of t.alarms || []) add(w.start - a * MIN, 'alarm' + a, N.alarm, { before: a ? (a >= 1440 ? '하루' : fmtDur(a)) + ' 뒤' : '지금' });
        if (t.type !== 'jab' || t.jabOn === false) continue; // 아래는 잡도리 일정만
        if (!started && !(t.alarms || []).includes(0)) add(w.start, 'start', N.start);
        if (!started) add(w.start + 10 * MIN, 'late', N.late);
        const dl = w.deadline || w.end;
        add(dl - 30 * MIN, 'urgent', N.urgent);
        add(dl, 'due', N.due);
      }
    }
    return out.sort((a, b) => a.ms - b.ms).slice(0, 60);
  },
  idOf(n) { // 안드로이드 알림 번호는 32비트 정수여야 함
    let h = 7;
    const s = n.key + ':' + n.kind;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h) % 2000000000 + 1;
  },
  // 저장할 때마다 불리지만, 알림 목록이 바뀌었을 때만 실제로 다시 예약한다
  schedule(force) {
    if (!NATIVE.on || !NATIVE.Notif) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.apply(force), 400);
  },
  async apply(force) {
    const list = this.plan();
    const sig = list.map((n) => n.key + n.kind + n.ms).join(',');
    if (!force && sig === this.sig) return;
    this.sig = sig;
    try {
      const p = await NATIVE.Notif.getPending();
      if (p && p.notifications && p.notifications.length) await NATIVE.Notif.cancel({ notifications: p.notifications.map((n) => ({ id: n.id })) });
      if (this.perm !== 'granted' || !list.length) { this.pending = 0; return; }
      await NATIVE.Notif.schedule({
        notifications: list.map((n) => ({
          id: this.idOf(n), title: n.title, body: n.body, channelId: this.CHANNEL, smallIcon: 'ic_stat_mireum', iconColor: '#D4532A',
          schedule: { at: new Date(n.ms), allowWhileIdle: true }, extra: { key: n.key, kind: n.kind },
        })),
      });
      this.pending = list.length;
    } catch (e) { this.pending = 0; }
  },
};

/* ---------- ④ 기기 음성 · 상태 표시줄 · 뒤로 가기 ---------- */
let lastBarStyle = null;
function nativeBars(dark) {
  if (!NATIVE.on || !NATIVE.Bars) return;
  // 웹뷰가 상태 표시줄 밑까지 그려지면(최신 웹뷰) 화면 색에 맞춰 글자색을 바꾸고,
  // 옛 웹뷰처럼 상태 표시줄 아래에서 시작하면 바탕이 늘 숯색이라 밝은 글자로 고정한다
  const inset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-top')) || 0;
  const edge = inset > 0;
  const style = dark || !edge ? 'DARK' : 'LIGHT'; // DARK = 어두운 바탕 위 밝은 글자
  if (style === lastBarStyle) return;
  lastBarStyle = style;
  try { NATIVE.Bars.setStyle({ style }); } catch (e) { /* 무시 */ }
}
function nativeBack() {
  if (ui.input) { ACT.wheelInputCancel(); return; }
  if (document.body.classList.contains('console-open')) { ACT.cToggle(); return; }
  if (ui.popup) return; // 딴짓 팝업은 답을 골라야 닫힘
  if (ui.sheet) { ACT.sheetScrim(); return; }
  if (ui.result) { ACT.resultClose(); return; }
  if (ui.focusKey) { ACT.exitFocus(); return; }
  if (member() && ui.tab !== 'today') { ui.tab = 'today'; render(); return; }
  try { NATIVE.App.minimizeApp(); } catch (e) { /* 무시 */ }
}

// 저장 직후마다 불림 (01-core save 끝)
function afterSave() {
  if (NATIVE.on) NOTIF.schedule(false);
}

/* ---------- 시작 ---------- */
// 스크립트가 읽히자마자(화면 그리기 전에) 실행: 진짜 앱은 처음부터 실제 시각으로 동작
(function nativeBoot() {
  if (!NATIVE.on) return;
  if (!state.nativeInit) {
    state.nativeInit = true;
    state.realTime = true;
    state.auto = false;
    state.clock = Math.floor(Date.now() / MIN) * MIN;
    state.settledDay = ymd(state.clock);
    save();
  }
})();
// init() 끝에서 불림
function nativeInit() {
  if (!NATIVE.on) return;
  document.body.classList.toggle('demo', !!state.showDemo);
  NOTIF.init();
  nativeRestoreSession();
  try {
    NATIVE.App.addListener('backButton', nativeBack);
    NATIVE.App.addListener('resume', () => { if (state.realTime) syncRealClock(true); nativeRestoreSession(); NOTIF.schedule(true); TTS.check(); });
    NATIVE.App.addListener('pause', () => TTS.stop()); // 앱을 내리면 읽던 말도 멈춘다
  } catch (e) { /* 무시 */ }
}

/* ---------- 나 탭에 쓰는 조각 ---------- */
// 카카오 동의 내역 → [이름, 표시, 동의 여부] 줄 목록
function kakaoConsentRows(m) {
  // 이메일(account_email)은 동의항목 권한이 없어 받지 않으므로 보여 주지 않는다
  const MAIN = ['profile_nickname', 'profile_image'];
  if (Array.isArray(ui.scopes)) {
    const list = ui.scopes.filter((s) => s.id !== 'account_email' && (s.agreed || MAIN.includes(s.id)));
    if (list.length) return list.map((s) => [s.name, '', !!s.agreed]);
  }
  // 동의 내역을 아직 못 받았으면(불러오는 중·오프라인) 받은 정보로 대신 표시
  return [['닉네임', ui.scopesLoading ? '확인 중' : '', !!m.nickname], ['프로필 사진', '', !!m.profileImageUrl]];
}
function notifRow() {
  const on = !state.notifOff;
  let sub = `앱을 꺼 둬도 시작·10분 지각·마감 30분 전·마감 때 알려요 · 예약 ${NOTIF.pending}개`;
  if (on && NOTIF.perm === 'denied') sub = '알림 권한이 꺼져 있어요. 스위치를 다시 켜거나 휴대폰 설정 > 애플리케이션 > 잡도리 > 알림에서 켜 주세요';
  else if (on && !state.realTime) sub = '시연용 가상 시각을 쓰는 중이라 알림을 예약하지 않아요 (시연 도구에서 실제 시각 쓰기를 켜면 예약)';
  else if (!on) sub = '알림을 껐어요. 앱 안에서만 잔소리해요';
  return `<h2 class="sec-label">알림</h2>
      <div class="list-btn as-row"><span class="lb-text"><b>시작·마감 알림</b><small>${sub}</small></span>
        <button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" aria-label="시작·마감 알림" data-act="notifToggle"><i></i></button></div>`;
}

Object.assign(ACT, {
  notifToggle: async () => {
    state.notifOff = !state.notifOff; save();
    if (!state.notifOff && NOTIF.perm !== 'granted') await NOTIF.ask();
    NOTIF.schedule(true); render();
    setTimeout(render, 900); // 예약 개수 반영
  },
  demoToggle: () => { state.showDemo = !state.showDemo; document.body.classList.toggle('demo', state.showDemo); save(); render(); if (state.showDemo) toast("오른쪽 가장자리의 '시연' 탭을 눌러 보세요."); },
  // 카카오 설정 전에도 앱을 둘러볼 수 있게: 흉내 로그인으로 바로 들어가기
  loginFake: () => { state.fakeLogin = true; ui.login = { busy: false }; save(); startLogin(); },
  realLogin: () => { state.fakeLogin = false; ui.login = { busy: false }; save(); render(); },
  cFake: () => { state.fakeLogin = !state.fakeLogin; save(); renderConsole(true); toast(state.fakeLogin ? '다음 로그인부터 흉내 모드예요 (카카오에 연결하지 않음).' : '다음 로그인부터 진짜 카카오 로그인이에요.'); },
});
