      <g class="mr-scale " style="transform:scale(1.011)">
        
        <ellipse class="mr-foot" cx="97" cy="197" rx="14" ry="8.5"/><ellipse class="mr-foot" cx="143" cy="197" rx="14" ry="8.5"/>
