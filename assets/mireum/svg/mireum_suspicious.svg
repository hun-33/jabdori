        <g class="mr-face">
          <ellipse class="mr-cheek" cx="83" cy="144" rx="11.5" ry="7"/><ellipse class="mr-cheek" cx="157" cy="144" rx="11.5" ry="7"/>
          <g class="mr-brows"><path d="M92 118.5 H107"/><path d="M132 115 q8 -6 16 0"/></g><g class="mr-eyes"><path d="M92 127 H108"/><path d="M132 127 H148"/><circle cx="104" cy="130.5" r="3.4" class="f"/><circle cx="144" cy="130.5" r="3.4" class="f"/></g><g class="mr-mouth"><path d="M113 143.5 q4 -3 7.5 0 t7.5 -1"/></g>
        </g>
        
        <g class="mr-pose"><ellipse class="mr-arm " cx="43" cy="158" rx="10" ry="13.5" transform="rotate(-18 43 158)"/><g class="mr-arm-r"><ellipse class="mr-arm " cx="206" cy="108" rx="10" ry="13.5" transform="rotate(22 206 108)"/></g></g>
      </g>
      <g class="mr-fx fx-q"><path d="M184 66 q0 -12 12 -12 q12 0 12 11 q0 8 -9 11 q-3 1 -3 6"/><circle cx="196" cy="91" r="2.6" class="dot"/></g>
    </g>
  </svg>