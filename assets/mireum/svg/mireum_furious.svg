        </g>
        
        <g class="mr-pose"><ellipse class="mr-arm " cx="36" cy="138" rx="10" ry="13.5" transform="rotate(-70 36 138)"/><ellipse class="mr-arm " cx="204" cy="138" rx="10" ry="13.5" transform="rotate(70 204 138)"/></g>
      </g>
