<svg xmlns="http://www.w3.org/2000/svg" class="mireum e-furious p-puff m-none bristle" viewBox="0 0 240 240" aria-hidden="true" focusable="false"><style>/* =========================================================
   미루먼지 스타일과 동작 (transform·opacity만 움직인다)
   ========================================================= */
.mireum { display: block; width: 100%; height: auto; overflow: visible; --m-body: #FFF7EA; --m-line: #6B574B; --m-face: #3B2E28; --m-cheek: #F2A7A7; --m-shadow: rgba(43, 38, 34, .12); }
.on-stove .mireum, .stove-band .mireum, .popup .mireum, .heat-preview .mireum, .result.r-bad .mireum { --m-shadow: rgba(10, 8, 7, .32); }
.mireum .mr-shadow { fill: var(--m-shadow); }
.mireum .mr-body, .mireum .mr-tuft, .mireum .mr-foot, .mireum .mr-arm { fill: var(--m-body); stroke: var(--m-line); stroke-width: 3.4; stroke-linejoin: round; }
.mireum .mr-curl { fill: none; stroke: var(--m-line); stroke-width: 3; stroke-linecap: round; }
.mireum .mr-face path, .mireum .mr-brows path { fill: none; stroke: var(--m-face); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mireum .mr-face .f { fill: var(--m-face); stroke: none; }
.mireum .mr-face .hl { fill: #FFFFFF; }
.mireum .mr-face .thick { stroke-width: 3.8; }
.mireum .mr-face .tongue { fill: #F08A8A; stroke: none; }
.mireum .mr-cheek { fill: var(--m-cheek); opacity: .75; }
.mireum.e-angry .mr-cheek, .mireum.e-furious .mr-cheek { fill: #EE8D7E; opacity: .85; }
.mireum.e-sleepy .mr-cheek { opacity: .55; }
/* 효과 */
.mireum .mr-fx path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mireum .fx-spark path { fill: #F3CF62; stroke: none; }
.mireum .fx-q path { stroke: var(--m-line); stroke-width: 4; }
.mireum .fx-q .dot, .mireum .fx-bang .dot { fill: var(--m-line); }
.mireum .fx-bang path { stroke: var(--m-line); stroke-width: 4.2; }
.mireum .fx-vein path { stroke: #E5735F; stroke-width: 4; }
.mireum .fx-steam path { stroke: #BFB2A2; stroke-width: 4.5; }
.on-stove .mireum .fx-steam path, .stove-band .mireum .fx-steam path { stroke: #D9CFC0; }
.mireum .fx-gloom path { stroke: #A99BD8; stroke-width: 3; opacity: .75; }
.mireum .fx-sweat path { fill: #9CC6EC; stroke: none; }
.mireum .fx-tears path { stroke: #9CC6EC; stroke-width: 4; }
.mireum .fx-tears .drop { fill: #9CC6EC; stroke: none; }
.mireum .fx-zz path { stroke: #A99BD8; stroke-width: 3.6; }
/* 소품 */
.mireum .prop-clip .wood { fill: #E9C9A0; stroke: var(--m-line); stroke-width: 3; }
.mireum .prop-clip .paper { fill: #FFFDF8; stroke: none; }
.mireum .prop-clip .clip { fill: #B8A587; stroke: var(--m-line); stroke-width: 2.4; }
.mireum .prop-clip .tick { fill: none; stroke: #8F82C8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mireum .prop-clip .ln { stroke: #D8CFC2; stroke-width: 3; stroke-linecap: round; }
.mireum .prop-flag .pole { stroke: var(--m-line); stroke-width: 3.4; stroke-linecap: round; fill: none; }
.mireum .prop-flag .cloth { fill: #F6DE8D; stroke: var(--m-line); stroke-width: 2.6; stroke-linejoin: round; }
.mireum .prop-flag .star { fill: #FFFDF8; }
/* 코스튬 */
.mireum .cos-bunny .b { fill: var(--m-body); stroke: var(--m-line); stroke-width: 3.4; }
.mireum .cos-bunny .in { fill: #F6C6C6; }
.mireum .cos-wizard .hat, .mireum .cos-wizard .brim { fill: #A99BD8; stroke: var(--m-line); stroke-width: 3.2; stroke-linejoin: round; }
.mireum .cos-wizard .brim { fill: #9686CF; }
.mireum .cos-wizard .star { fill: #F3CF62; }
.mireum .cos-angel .wing { fill: var(--m-body); stroke: var(--m-line); stroke-width: 3; stroke-linejoin: round; }
.mireum .halo { fill: none; stroke: #F3CF62; stroke-width: 4.5; }
.mireum .cos-devil .horn, .mireum .cos-devil .tip { fill: #E88B7D; stroke: var(--m-line); stroke-width: 3; stroke-linejoin: round; }
.mireum .cos-devil .tail { fill: none; stroke: var(--m-line); stroke-width: 3.4; stroke-linecap: round; }

/* ---------- 동작 ---------- */
.mireum .mr-all, .mireum .mr-scale, .mireum .mr-arm-r, .mireum .mr-arm-l, .mireum .mr-eyes, .mireum .mr-fx { transform-box: view-box; }
.mireum .mr-all { transform-origin: 120px 200px; }
.mireum .mr-scale { transform-origin: 120px 200px; transition: transform .5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.mireum .mr-scale.squash { transform: scale(1.06, .9) !important; }
.mireum .mr-eyes { transform-origin: 120px 130px; }
.mireum .mr-arm-r { transform-origin: 186px 128px; }
.mireum .mr-arm-l { transform-origin: 54px 128px; }
/* 숨쉬기 (기본 대기) + 눈 깜빡임 */


/* 둘러보기 (일정 없음·기다림) */

/* 통통 튀기 (반가움) + 손 흔들기 */


/* 기뻐서 뛰어오르기 (성공) */


/* 화나서 부풀기 (마감 임박·반복 실패) */




/* 잔소리하기 (팔 흔들기) */

/* 울면서 주저앉기 (실패) */



/* 잠들어 웅크리기 */


/* 쫓아오기 (딴짓 감지 팝업 등장) */


/* 체크리스트 확인 (일정 등록·집중) */
.mireum .prop-clip .tick { stroke-dasharray: 16; stroke-dashoffset: 16; }
.mireum:not(.m-check) .prop-clip .tick { stroke-dashoffset: 0; }


/* 움직임 줄이기 */
  .mireum .prop-clip .tick { stroke-dashoffset: 0; }
  .mireum .fx-steam .st { opacity: .8; }
}
html.reduce .mireum .prop-clip .tick { stroke-dashoffset: 0; }
html.reduce .mireum .fx-steam .st { opacity: .8; }
</style>
    <ellipse class="mr-shadow" cx="120" cy="203" rx="70" ry="9"/>
