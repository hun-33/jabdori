# 저장소를 새로 만들면서 사라진 build-1~9 릴리스를 되살리는 작업. 직접 눌러야만 돈다.
# 실행: 저장소 Actions 탭 > "릴리스 되살리기 (build-1~9)" > Run workflow
# 빌드마다:
#   - APK: release-backup 브랜치의 원본 파일(apk/build-N.apk). 원본이 없는 build-4·7은 그 빌드 코드로 다시 만든다.
#   - 코드 백업: 태그 build-N(그 빌드를 만든 커밋)의 코드를 jabdori-source-build-N.zip으로
#   - 설명: 설치 안내 + release-notes/build-N.md + 백업·복원 안내
#   이미 있는 릴리스면 파일을 바꿔 올리고 설명만 고친다. 여러 번 실행해도 결과가 같다.
name: 릴리스 되살리기 (build-1~9)

on:
  workflow_dispatch:
    inputs:
      builds:
        description: '되살릴 빌드 번호 (쉼표로 구분)'
        default: '1,2,3,4,5,6,7,8,9'

permissions:
  contents: write

jobs:
  rebuild:
    name: 원본 APK가 없는 빌드 다시 만들기 (build-${{ matrix.n }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [4, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-${{ matrix.n }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - name: APK 빌드
        working-directory: android
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk jabdori.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ matrix.n }}
          path: jabdori.apk

  release:
    name: 릴리스 만들기
    needs: rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: release-backup
          path: backup
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-build-*
          path: rebuilt

      - name: build-1~9 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ inputs.builds }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          for n in ${BUILDS//,/ }; do
            sha=$(git rev-list -n1 "build-$n" 2>/dev/null || true)
            if [ -z "$sha" ]; then echo "build-$n: 태그가 없어서 건너뜀"; continue; fi
            out="out/$n"; mkdir -p "$out"
            if [ -f "rebuilt/apk-build-$n/jabdori.apk" ]; then
              cp "rebuilt/apk-build-$n/jabdori.apk" "$out/jabdori.apk"
              apkline="- 원본 APK가 남아 있지 않아, jabdori.apk는 이 빌드에 쓰인 코드(커밋 ${sha:0:7})로 다시 만든 파일입니다. 코드는 jabdori-source-build-$n.zip과 Source code 파일에 있습니다."
            elif [ -f "backup/apk/build-$n.apk" ]; then
              cp "backup/apk/build-$n.apk" "$out/jabdori.apk"
              apkline="- 이 릴리스의 jabdori.apk는 build-$n 때 만든 파일 그대로이며, 이 빌드에 쓰인 코드는 jabdori-source-build-$n.zip과 Source code 파일(커밋 ${sha:0:7})에 있습니다."
            else
              echo "build-$n: APK가 없어서 건너뜀"; continue
            fi
            git archive --format=zip --prefix="jabdori-build-$n/" -o "$out/jabdori-source-build-$n.zip" "$sha"

            key=$(git show "$sha:android/gradle.properties" 2>/dev/null | grep -E '^KAKAO_NATIVE_APP_KEY=' | cut -d= -f2 | tr -d '[:space:]' || true)
            if [ -n "$key" ]; then status="됨 (진짜 카카오 로그인)"; else status="안 됨 (흉내 모드로 둘러보기)"; fi

            {
              echo "폰에서 아래 jabdori.apk 를 눌러 받은 뒤 설치하세요."
              echo "카카오 키 설정: $status"
              echo "항상 최신 버전 받기: https://github.com/$REPO/releases/latest/download/jabdori.apk"
              echo
              echo "---"
              echo
              if [ -f "release-notes/build-$n.md" ]; then cat "release-notes/build-$n.md"; else echo "# build-$n"; fi
              last=$(grep -E '^## ' "release-notes/build-$n.md" 2>/dev/null | tail -1 || true)
              if [ "$last" != "## 참고 사항 (Notes)" ]; then echo; echo "## 참고 사항 (Notes)"; fi
              echo "$apkline"
              echo "- 저장소를 새로 만들면서 2026-11-25에 다시 올린 릴리스입니다. 배포일은 처음 빌드한 날입니다."
            } > "$out/body.md"

            if gh release view "build-$n" > /dev/null 2>&1; then
              gh release upload "build-$n" "$out/jabdori.apk" "$out/jabdori-source-build-$n.zip" --clobber
              gh release edit "build-$n" --notes-file "$out/body.md"
              echo "build-$n: 파일·설명 갱신"
            else
              latest=false; [ "$n" = "9" ] && latest=true
              gh release create "build-$n" --verify-tag --title "잡도리 앱 ($n번째 빌드)" --notes-file "$out/body.md" --latest="$latest" \
                "$out/jabdori.apk" "$out/jabdori-source-build-$n.zip"
              echo "build-$n: 릴리스 만듦 (커밋 ${sha:0:7})"
            fi
          done
