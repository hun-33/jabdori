# 이미 만든 릴리스(build-1~9)에 릴리스 노트와 백업을 반영하는 작업. 직접 눌러야만 돈다.
# 실행: 저장소 Actions 탭 > "릴리스 노트·백업 반영" > Run workflow
# 하는 일 (빌드마다):
#   1) 태그 build-N을 그 빌드를 만든 커밋으로 옮김 → 릴리스의 Source code(zip, tar.gz)가 그 빌드 코드가 됨
#   2) 그 빌드 코드를 jabdori-source-build-N.zip으로 묶어 릴리스에 첨부 (이미 있으면 바꿔 올림)
#   3) release-notes/build-N.md가 있으면 릴리스 설명을 "설치 안내 + --- + 노트"로 바꿈 (설치 안내 줄은 그대로 둠)
# APK(jabdori.apk)는 건드리지 않는다. 여러 번 실행해도 결과가 같다.
name: 릴리스 노트·백업 반영

on:
  workflow_dispatch:
    inputs:
      builds:
        description: '반영할 빌드 번호 (쉼표로 구분)'
        default: '1,2,3,4,5,6,7,8,9'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0

      - name: 빌드마다 태그 · 코드 백업 · 노트 반영
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ inputs.builds }}
        run: |
          set -euo pipefail
          for n in ${BUILDS//,/ }; do
            sha=$(jq -r --arg n "$n" '.[$n] // empty' release-notes/builds.json)
            if [ -z "$sha" ]; then echo "build-$n: 커밋 정보가 없어서 건너뜀"; continue; fi
            if ! gh release view "build-$n" > /dev/null 2>&1; then echo "build-$n: 릴리스가 없어서 건너뜀"; continue; fi

            git tag -f "build-$n" "$sha"
            git push -f origin "refs/tags/build-$n"

            git archive --format=zip --prefix="jabdori-build-$n/" -o "jabdori-source-build-$n.zip" "$sha"
            gh release upload "build-$n" "jabdori-source-build-$n.zip" --clobber

            if [ -f "release-notes/build-$n.md" ]; then
              gh release view "build-$n" --json body -q .body | awk '/^---[[:space:]]*$/{exit} {print}' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > head.md
              { cat head.md; printf '\n---\n\n'; cat "release-notes/build-$n.md"; } > body.md
              gh release edit "build-$n" --notes-file body.md
            fi
            echo "build-$n: 완료 (커밋 ${sha:0:7})"
          done
