# GitHub에 올리면 클라우드(맥)에서 아이폰 앱(.ipa)을 자동으로 만들어 주는 설정
# - 안드로이드(android-apk.yml)와 따로 돈다: 릴리스 태그는 ios-build-1, ios-build-2 … (안드로이드는 build-N)
# - 아이폰 릴리스는 'Latest'로 표시하지 않는다 → 안드로이드 고정 주소(releases/latest/download/jabdori.apk)가 그대로 유지됨
# - 서명하지 않은 .ipa 라서, 각자 Windows에서 Sideloadly로 자기 Apple ID로 서명해 설치한다 (무료 Apple ID는 7일마다 다시 설치)
# - 카카오 키: 저장소 Secrets 의 KAKAO_NATIVE_APP_KEY, 없으면 android/gradle.properties 의 같은 키를 쓴다
# - 커밋 설명에 [ios skip] 이 있으면 아이폰 빌드를 건너뛴다 (번호도 쓰지 않음)
name: 아이폰 IPA 만들기

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/dev-check.yml'
      - '.github/workflows/ios-dev-check.yml'
      - '.github/workflows/restore-releases.yml'
      - 'release-notes/**'
      - 'tools/**'
      - 'voice/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # Releases에 IPA를 올리려면 필요

concurrency:
  group: ios-release      # 두 번 연달아 올려도 번호가 겹치지 않게 차례대로
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ios skip]') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 빌드 번호 (지금까지 ios-build-N 태그 중 가장 큰 번호 + 1)
        id: num
        run: |
          git fetch --tags --force -q
          last=$(git tag -l 'ios-build-*' | sed 's/^ios-build-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 패키지 설치
        run: npm install

      - name: 웹 화면 합치기 + 아이폰에 복사
        run: npm run build:ios

      - name: Xcode 버전
        run: xcodebuild -version

      - name: 카카오 키 준비 (값은 로그에 나오지 않게 가림)
        id: kakao
        env:
          SECRET_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          KEY="$SECRET_KEY"
          if [ -z "$KEY" ]; then KEY=$(grep -E '^KAKAO_NATIVE_APP_KEY=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]'); fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "KAKAO_KEY=$KEY" >> "$GITHUB_ENV"
            echo "status=됨 (진짜 카카오 로그인)" >> "$GITHUB_OUTPUT"
          else
            echo "status=안 됨 (흉내 모드로 둘러보기)" >> "$GITHUB_OUTPUT"
          fi

      - name: 앱 빌드 (서명 없이)
        working-directory: ios/App
        env:
          N: ${{ steps.num.outputs.n }}
        run: |
          set +e
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            KAKAO_NATIVE_APP_KEY="$KAKAO_KEY" CURRENT_PROJECT_VERSION="$N" \
            build > build.log 2>&1
          code=$?
          grep -E "(error|warning): " build.log | grep -v "/SourcePackages/" | sort -u | head -80
          if [ $code -ne 0 ]; then tail -120 build.log; exit $code; fi

      - name: 빌드 기록 보관 (실패했을 때 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/App/build.log

      - name: .ipa 로 묶기
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -q '^kakao..' && echo "카카오 URL 스킴 들어감" || echo "카카오 URL 스킴 비어 있음"
          test -f "$APP/public/index.html" && echo "웹 화면 들어감"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry jabdori.ipa Payload
          ls -l jabdori.ipa

      - name: Actions 결과물로도 보관
        uses: actions/upload-artifact@v4
        with:
          name: jabdori-ipa
          path: jabdori.ipa

      - name: 이 빌드 코드 백업
        run: git archive --format=zip --prefix=jabdori-ios-build-${{ steps.num.outputs.n }}/ -o jabdori-ios-source-build-${{ steps.num.outputs.n }}.zip HEAD

      - name: 릴리스 설명 만들기 (release-notes/ios-build-번호.md가 있으면 그 내용, 없으면 커밋 설명)
        env:
          STATUS: ${{ steps.kakao.outputs.status }}
          N: ${{ steps.num.outputs.n }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "아이폰용 잡도리 앱입니다. 아래 jabdori.ipa 를 Windows PC에 받은 뒤 Sideloadly로 설치하세요 (설치 방법은 저장소 README의 '아이폰에 설치하기')."
            echo "무료 Apple ID로 설치하면 7일 동안 열리고, 그 뒤에는 Sideloadly로 다시 설치해야 합니다."
            echo "카카오 키 설정: $STATUS"
            echo
            echo "---"
            echo
            if [ -f "release-notes/ios-build-$N.md" ]; then
              cat "release-notes/ios-build-$N.md"
            else
              echo "# ios-build-$N"
              echo
              printf '%s\n' "$MSG" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            fi
            echo
            echo "이 릴리스의 jabdori.ipa는 ios-build-$N 때 만든 파일 그대로이며, 이 빌드에 쓰인 코드는 jabdori-ios-source-build-$N.zip(커밋 ${GITHUB_SHA::7})에 있습니다."
          } > release-body.md

      - name: Releases에 올리기 (Latest 표시는 안드로이드에 남겨 둠)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ steps.num.outputs.n }}
          name: "[아이폰] 잡도리 앱 ios-build-${{ steps.num.outputs.n }}"
          body_path: release-body.md
          files: |
            jabdori.ipa
            jabdori-ios-source-build-${{ steps.num.outputs.n }}.zip
          make_latest: false
