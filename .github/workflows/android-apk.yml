# GitHub에 올리면 클라우드에서 안드로이드 APK를 자동으로 만들어 주는 설정
# - 저장소 Settings > Secrets and variables > Actions 에 KAKAO_NATIVE_APP_KEY 를 등록하면 진짜 카카오 로그인이 켜진 APK가 나온다
#   (등록 안 해도 APK는 만들어지고, 앱에서 '흉내 모드로 둘러보기'로 써 볼 수 있다)
# - 결과: 저장소 첫 화면 오른쪽 Releases > 맨 위 > jabdori.apk  (폰에서 눌러 바로 받기)
#   고정 주소: https://github.com/<아이디>/<저장소>/releases/latest/download/jabdori.apk
name: 안드로이드 APK 만들기

on:
  push:
    branches: [ main, android-app ]
  workflow_dispatch:

permissions:
  contents: write   # Releases에 APK를 올리려면 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install

      - name: 웹 화면 합치기 + 안드로이드에 복사
        run: npm run build

      - name: APK 빌드
        working-directory: android
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 카카오 키 확인
        id: kakao
        env:
          SECRET_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          FILE_KEY=$(grep -E '^KAKAO_NATIVE_APP_KEY=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -n "$SECRET_KEY" ] || [ -n "$FILE_KEY" ]; then
            echo "status=됨 (진짜 카카오 로그인)" >> "$GITHUB_OUTPUT"
          else
            echo "status=안 됨 (흉내 모드로 둘러보기)" >> "$GITHUB_OUTPUT"
          fi

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jabdori.apk

      - name: Actions 결과물로도 보관
        uses: actions/upload-artifact@v4
        with:
          name: jabdori-apk
          path: jabdori.apk

      - name: Releases에 올려서 다운로드 링크 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 잡도리 앱 (${{ github.run_number }}번째 빌드)
          body: |
            폰에서 아래 jabdori.apk 를 눌러 받은 뒤 설치하세요.
            카카오 키 설정: ${{ steps.kakao.outputs.status }}
            항상 최신 버전 받기: https://github.com/${{ github.repository }}/releases/latest/download/jabdori.apk
          files: jabdori.apk
          make_latest: true
