# GitHub에 올리면 클라우드에서 안드로이드 APK를 자동으로 만들어 주는 설정
# - 저장소 Settings > Secrets and variables > Actions 에 KAKAO_NATIVE_APP_KEY 를 등록하면 진짜 카카오 로그인이 켜진 APK가 나온다
#   (등록 안 해도 APK는 만들어지고, 앱에서 '흉내 모드로 둘러보기'로 써 볼 수 있다)
# - 결과: 저장소 첫 화면 오른쪽 Releases > 맨 위 > jabdori.apk  (폰에서 눌러 바로 받기)
#   고정 주소: https://github.com/<아이디>/<저장소>/releases/latest/download/jabdori.apk
# - 아이폰(ios-ipa.yml)과 따로 돈다: 아이폰 쪽 파일(ios/, native/ios-kakao/)만 바뀌면 안드로이드는 빌드하지 않는다
# - 커밋 설명에 [android skip] 이 있으면 안드로이드 빌드를 건너뛴다 (번호도 쓰지 않음)
name: 안드로이드 APK 만들기

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ios/**'
      - 'native/ios-kakao/**'
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/ios-dev-check.yml'
      - '.github/workflows/restore-releases.yml'
      - 'release-notes/**'
      - 'tools/**'
      - 'voice/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # Releases에 APK를 올리려면 필요

concurrency:
  group: android-release  # 두 번 연달아 올려도 번호가 겹치지 않게 차례대로
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[android skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 빌드 번호 (지금까지 build-N 태그 중 가장 큰 번호 + 1 → 건너뛴 실행이 있어도 번호가 비지 않음)
        id: num
        run: |
          git fetch --tags --force -q
          last=$(git tag -l 'build-*' | sed 's/^build-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install

      - name: 웹 화면 합치기 + 안드로이드에 복사
        run: npm run build

      - name: APK 빌드
        working-directory: android
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 카카오 키 확인
        id: kakao
        env:
          SECRET_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          FILE_KEY=$(grep -E '^KAKAO_NATIVE_APP_KEY=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -n "$SECRET_KEY" ] || [ -n "$FILE_KEY" ]; then
            echo "status=됨 (진짜 카카오 로그인)" >> "$GITHUB_OUTPUT"
          else
            echo "status=안 됨 (흉내 모드로 둘러보기)" >> "$GITHUB_OUTPUT"
          fi

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jabdori.apk

      - name: Actions 결과물로도 보관
        uses: actions/upload-artifact@v4
        with:
          name: jabdori-apk
          path: jabdori.apk

      - name: 이 빌드 코드 백업
        run: git archive --format=zip --prefix=jabdori-build-${{ steps.num.outputs.n }}/ -o jabdori-source-build-${{ steps.num.outputs.n }}.zip HEAD

      - name: 릴리스 설명 만들기 (release-notes/build-번호.md가 있으면 그 내용, 없으면 커밋 설명)
        env:
          STATUS: ${{ steps.kakao.outputs.status }}
          N: ${{ steps.num.outputs.n }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "안드로이드용 잡도리 앱입니다. 폰에서 아래 jabdori.apk 를 눌러 받은 뒤 설치하세요."
            echo "카카오 키 설정: $STATUS"
            echo "항상 최신 버전 받기: https://github.com/$REPO/releases/latest/download/jabdori.apk"
            echo
            echo "---"
            echo
            if [ -f "release-notes/build-$N.md" ]; then
              cat "release-notes/build-$N.md"
            else
              echo "# build-$N"
              echo
              printf '%s\n' "$MSG" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            fi
            echo
            echo "이 릴리스의 jabdori.apk는 build-$N 때 만든 파일 그대로이며, 이 빌드에 쓰인 코드는 jabdori-source-build-$N.zip(커밋 ${GITHUB_SHA::7})에 있습니다."
          } > release-body.md

      - name: Releases에 올려서 다운로드 링크 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.num.outputs.n }}
          # 제목 맨 앞의 [안드로이드]·[아이폰]으로 한 목록 안에서 바로 구분 (README '릴리스 나눠 보기')
          name: "[안드로이드] 잡도리 앱 build-${{ steps.num.outputs.n }}"
          body_path: release-body.md
          files: |
            jabdori.apk
            jabdori-source-build-${{ steps.num.outputs.n }}.zip
          make_latest: true
